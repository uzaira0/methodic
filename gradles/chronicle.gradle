/**
 * To make use of this, mark a dependency as `changing: true` if it is a snapshot dependency
 *  This way it won't be cached and you'll always get the newest code.
 *  This should automagically work for '-SNAPSHOT' dependencies
 *
 * Ex:
 *  dependencies {
 *    compile group: "group", name: "projectA", version: "1.1-SNAPSHOT", changing: true
 *  }
 */
// Declared ABOVE configurations.all because the force strings below interpolate
// it eagerly (the closure runs immediately for already-created configurations).
// Single shared pin for the BouncyCastle family: consumed by the force block here
// and by chronicle-models' explicit bcprov dependency.
ext.bouncycastle_version='1.84'

configurations.all {
  // check for updates every build
  resolutionStrategy.cacheChangingModulesFor 0, 'seconds'

  // Force secure versions of transitive dependencies (CVE remediation)
  resolutionStrategy {
    force 'com.google.protobuf:protobuf-java:3.25.5'
    // protobuf-java-util 3.22.0 lingers on the compile classpath (unforced transitive)
    // and carries CVE-2024-7254 (StackOverflow DoS). Runtime already resolves 3.25.8;
    // force the util artifact to the patched 3.25.5 line so the compile classpath matches.
    force 'com.google.protobuf:protobuf-java-util:3.25.5'
    // spring-tx arrives transitively at 6.2.15 (not in rhizome's explicit spring_framework_version
    // list); align it to the patched 6.2.19 so it isn't version-range-matched against the
    // Spring Framework CVEs (CVE-2026-41842/41848/41838/41851/41850). Keep in sync with
    // spring_framework_version below.
    force 'org.springframework:spring-tx:6.2.19'
    // org.eclipse.angus:jakarta.mail (the impl, distinct from angus-mail) lingers at 2.0.2 and
    // carries CVE-2025-7962 (SMTP CRLF injection); lift to the patched 2.0.4 (sync w/ angus_mail_version).
    force 'org.eclipse.angus:jakarta.mail:2.0.4'
    // Keep the Jackson parser/dataformat family on the patched 2.22.1 release.
    // jackson-annotations intentionally uses Jackson's MAJOR.MINOR versioning.
    force 'com.fasterxml.jackson.core:jackson-core:2.22.1'
    force 'com.fasterxml.jackson.core:jackson-databind:2.22.1'
    force 'com.fasterxml.jackson.core:jackson-annotations:2.22'
    force 'com.fasterxml.jackson.dataformat:jackson-dataformat-cbor:2.22.1'
    force 'com.fasterxml.jackson.dataformat:jackson-dataformat-smile:2.22.1'
    force 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.22.1'
    force 'com.fasterxml.woodstox:woodstox-core:7.2.0'
    force 'org.jsoup:jsoup:1.23.1'
    force 'commons-beanutils:commons-beanutils:1.11.0'
    force 'io.grpc:grpc-netty-shaded:1.75.0'
    // Align the whole gRPC family to 1.75.0 (matches grpc-netty-shaded). Fixes
    // GHSA-cfgp-2977-2fmm + GHSA-9hxf-ppjv-w6rq in grpc-protobuf 1.54.1, pulled in
    // transitively via io.temporal:temporal-sdk:1.27.0. 1.54.x has no compatible
    // CVE-fixed micro release that keeps the family consistent, so we lift to 1.75.0.
    force 'io.grpc:grpc-protobuf:1.75.0'
    force 'io.grpc:grpc-protobuf-lite:1.75.0'
    force 'io.grpc:grpc-services:1.75.0'
    force 'io.grpc:grpc-stub:1.75.0'
    // CVE-2025-48924 is fixed in Commons Lang 3.18+. Apply the maintained
    // release to build-tool configurations too (notably PIT), not just runtime.
    force 'org.apache.commons:commons-lang3:3.19.0'
    // Keep build-tool configurations (including SpotBugs) off vulnerable
    // Log4j releases as well as the shipped server runtime.
    force 'org.apache.logging.log4j:log4j-api:2.25.5'
    force 'org.apache.logging.log4j:log4j-core:2.25.5'
    force 'org.apache.logging.log4j:log4j-slf4j2-impl:2.25.5'
    force 'org.apache.logging.log4j:log4j-web:2.25.5'
    // Checkstyle's documentation helper stack otherwise imports vulnerable
    // HTTP/Plexus versions even though the analyzer is build-time only.
    force 'org.apache.httpcomponents.client5:httpclient5:5.6.3'
    force 'org.apache.httpcomponents.core5:httpcore5:5.4.3'
    force 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
    force 'org.codehaus.plexus:plexus-utils:3.6.1'
    force 'org.springframework.retry:spring-retry:2.0.13'
    // Temporal 1.x still imports Micrometer 1.9.9. The OSS fix for the remotely
    // triggerable HTTP instrumentation/resource-exhaustion issues (CVE-2026-40983 and
    // CVE-2026-40984) is available only on the maintained 1.15 line. Keep the family
    // aligned; forcing core alone would mix incompatible commons/observation internals.
    force 'io.micrometer:micrometer-core:1.15.12'
    force 'io.micrometer:micrometer-commons:1.15.12'
    force 'io.micrometer:micrometer-observation:1.15.12'
    force "org.bouncycastle:bcpg-jdk18on:${bouncycastle_version}"
    force "org.bouncycastle:bcprov-jdk18on:${bouncycastle_version}"
    // bcpkix pulled in (1.80) via the Kotlin compiler classpath; lift to 1.84 to
    // clear GHSA-wg6q-6289-32hp and align with bcprov/bcpg.
    force "org.bouncycastle:bcpkix-jdk18on:${bouncycastle_version}"
    // commons-compress: lift transitive 1.25.0/1.24.0 to 1.26.0
    // (GHSA-4265-ccf5-phj5, GHSA-4g9r-vxhx-9pgx).
    force 'org.apache.commons:commons-compress:1.26.0'
    // RabbitMQ Java client 5.34.0 contains the complete July 2026 protocol,
    // TLS, parsing, and allocation hardening released after 5.33.1.
    force 'com.rabbitmq:amqp-client:5.34.0'
    // Keep the whole Netty family aligned on the release containing the
    // netty-codec-http request-smuggling fix (GHSA-8c42-7qj2-3j46).
    force "io.netty:netty-codec-http2:4.2.17.Final"
    force "io.netty:netty-codec-http:4.2.17.Final"
    force "io.netty:netty-codec:4.2.17.Final"
    force "io.netty:netty-codec-base:4.2.17.Final"
    force "io.netty:netty-codec-compression:4.2.17.Final"
    force "io.netty:netty-handler:4.2.17.Final"
    force "io.netty:netty-buffer:4.2.17.Final"
    force "io.netty:netty-common:4.2.17.Final"
    force "io.netty:netty-transport:4.2.17.Final"
    force "io.netty:netty-transport-classes-epoll:4.2.17.Final"
    force "io.netty:netty-transport-native-unix-common:4.2.17.Final"
    force "io.netty:netty-resolver:4.2.17.Final"
  }

  resolutionStrategy.dependencySubstitution.all { DependencySubstitution dependency ->
    if (dependency.requested instanceof ModuleComponentSelector && dependency.requested.group == "com.openlattice") {
      logger.debug("replacing ${dependency.requested} with local project :${dependency.requested.module} while resolving ${this.project}")
      def targetProject = findProject(":${dependency.requested.module}")
      if (targetProject != null) {
        dependency.useTarget(targetProject)
      }
    }
    // Redirect all lz4 variants to org.lz4:lz4-java (fixes capability conflicts)
    if (dependency.requested instanceof ModuleComponentSelector
        && ((dependency.requested.group == "net.jpountz.lz4" && dependency.requested.module == "lz4")
            || (dependency.requested.group == "at.yawk.lz4" && dependency.requested.module == "lz4-java"))) {
      dependency.useTarget("org.lz4:lz4-java:${lz4_version}")
    }
  }

}

