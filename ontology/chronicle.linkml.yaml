classes:
  ChronicleContractSnapshot:
    tree_root: true
    description: Container for generated or reviewed Chronicle production contract
      state.
    slots:
    - deployment_profiles
    - observability_backends
    - source_device_types
    - participant_data_types
    - participation_statuses
    - study_lifecycle_statuses
    - consent_triggers
    - collection_data_dispositions
    - collection_privacy_classes
    - collection_module_ids
    - android_sensor_types
    - ios_sensor_types
    - study_features
    - audit_actions
slots:
  deployment_profiles:
    range: DeploymentProfile
    multivalued: true
  observability_backends:
    range: ObservabilityBackend
    multivalued: true
  source_device_types:
    range: SourceDeviceType
    multivalued: true
  participant_data_types:
    range: ParticipantDataType
    multivalued: true
  participation_statuses:
    range: ParticipationStatus
    multivalued: true
  study_lifecycle_statuses:
    range: StudyLifecycleStatus
    multivalued: true
  consent_triggers:
    range: ConsentTrigger
    multivalued: true
  collection_data_dispositions:
    range: CollectionDataDisposition
    multivalued: true
  collection_privacy_classes:
    range: CollectionPrivacyClass
    multivalued: true
  collection_module_ids:
    range: CollectionModuleId
    multivalued: true
  audit_actions:
