apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chronicle-app
  namespace: chronicle
  labels:
    app.kubernetes.io/name: chronicle
    app.kubernetes.io/part-of: chronicle
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: chronicle-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: production/chronicle/database
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: production/chronicle/auth
        property: jwt_secret
    - secretKey: HAZELCAST_SERVER_PASSWORD
      remoteRef:
        key: production/chronicle/cache
        property: server_password
    - secretKey: HAZELCAST_CLIENT_PASSWORD
      remoteRef:
        key: production/chronicle/cache
        property: client_password
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: production/chronicle/oidc
        property: client_secret
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: production/chronicle/smtp
        property: password
    - secretKey: VAULT_TOKEN
      remoteRef:
        key: production/chronicle/vault
        property: token
    - secretKey: CHRONICLE_SECURITY_METRICS_PASSWORD
      remoteRef:
        key: production/chronicle/observability
        property: metrics_password
    - secretKey: CHRONICLE_SECURITY_METRICS_PASSWORD_PREVIOUS
      remoteRef:
        key: production/chronicle/observability
        property: metrics_password_previous
    - secretKey: CHRONICLE_SECURITY_METRICS_PASSWORD_NEXT
      remoteRef:
        key: production/chronicle/observability
        property: metrics_password_next
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak
  namespace: chronicle
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: chronicle
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-secrets
    creationPolicy: Owner
  data:
    - secretKey: KEYCLOAK_DB_PASSWORD
      remoteRef:
        key: production/chronicle/keycloak
        property: db_password
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
        key: production/chronicle/keycloak
        property: admin_password
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: production/chronicle/oidc
        property: client_secret
    - secretKey: UPSTREAM_OIDC_CLIENT_SECRET
      remoteRef:
        key: production/chronicle/keycloak
        property: upstream_oidc_client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chronicle-postgres-tls
  namespace: chronicle
  labels:
    app.kubernetes.io/name: chronicle-postgres
    app.kubernetes.io/part-of: chronicle
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: chronicle-postgres-tls
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: production/chronicle/postgres-tls
        property: ca_crt
    - secretKey: server.crt
      remoteRef:
        key: production/chronicle/postgres-tls
        property: server_crt
    - secretKey: server.key
      remoteRef:
        key: production/chronicle/postgres-tls
        property: server_key
