apiVersion: v1
kind: Service
metadata:
  name: chronicle-apk-download
  namespace: chronicle
  labels:
    app.kubernetes.io/name: chronicle-apk-download
    app.kubernetes.io/part-of: chronicle
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: chronicle-apk-download
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chronicle-apk-download
  namespace: chronicle
  labels:
    app.kubernetes.io/name: chronicle-apk-download
    app.kubernetes.io/part-of: chronicle
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronicle-apk-download
  namespace: chronicle
  labels:
    app.kubernetes.io/name: chronicle-apk-download
    app.kubernetes.io/part-of: chronicle
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chronicle-apk-download
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chronicle-apk-download
        app.kubernetes.io/part-of: chronicle
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      serviceAccountName: chronicle-apk-download
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apk-download
          image: nginx:1.29.4-alpine@sha256:4870c12cd2ca986de501a804b4f506ad3875a0b1874940ba0a2c7f763f1855b2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.apk-download.conf
              readOnly: true
            - name: downloads
              mountPath: /srv/downloads
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: chronicle-apk-download-config
        - name: downloads
          persistentVolumeClaim:
            claimName: chronicle-apk-downloads
            readOnly: true
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chronicle-apk-downloads
  namespace: chronicle
  labels:
    app.kubernetes.io/name: chronicle-apk-download
    app.kubernetes.io/part-of: chronicle
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
