apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgres
  namespace: chronicle
  labels:
    app.kubernetes.io/name: keycloak-postgres
    app.kubernetes.io/part-of: chronicle
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keycloak-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: chronicle
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: chronicle
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 9000
      targetPort: management
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-postgres
  namespace: chronicle
  labels:
    app.kubernetes.io/name: keycloak-postgres
    app.kubernetes.io/part-of: chronicle
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: chronicle
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: chronicle
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-postgres
  namespace: chronicle
  labels:
    app.kubernetes.io/name: keycloak-postgres
    app.kubernetes.io/part-of: chronicle
spec:
  serviceName: keycloak-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-postgres
        app.kubernetes.io/part-of: chronicle
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      serviceAccountName: keycloak-postgres
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: keycloak
            - name: POSTGRES_DB
              value: chronicle_keycloak
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256 --auth-local=scram-sha-256
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: KEYCLOAK_DB_PASSWORD
          command:
            - sh
            - -c
            - |
              set -eu
              case "$POSTGRES_PASSWORD" in ''|change-me-*|CHANGE_ME*) echo "FATAL: set KEYCLOAK_DB_PASSWORD" >&2; exit 1 ;; esac
              exec docker-entrypoint.sh postgres \
                -c listen_addresses='*' \
                -c password_encryption=scram-sha-256 \
                -c log_connections=on \
                -c log_disconnections=on \
                -c log_statement=ddl
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: keycloak-postgres
          app.kubernetes.io/part-of: chronicle
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: chronicle
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: chronicle
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: chronicle
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      serviceAccountName: keycloak
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: ghcr.io/uzaira0/chronicle/chronicle-keycloak:sha-000000000000
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-postgres:5432/chronicle_keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: KEYCLOAK_DB_PASSWORD
            - name: KC_HTTP_RELATIVE_PATH
              value: /keycloak
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KEYCLOAK_PUBLIC_URL
              value: https://chronicle.example.com/keycloak
            - name: KEYCLOAK_REALM
              value: chronicle
            - name: KEYCLOAK_CHRONICLE_CLIENT_ID
              value: chronicle-web
            - name: KEYCLOAK_CHRONICLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: OIDC_CLIENT_SECRET
            - name: KEYCLOAK_DEFAULT_IDP
              value: upstream-oidc
            - name: CHRONICLE_SECURITY_REQUIRE_MFA
              value: "true"
            - name: CHRONICLE_SECURITY_MFA_IDP_PROOF_VERIFIED
              value: "false"
            - name: DOMAIN
              value: chronicle.example.com
            - name: UPSTREAM_OIDC_CLIENT_ID
              value: disabled-example-upstream-oidc
            - name: UPSTREAM_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: UPSTREAM_OIDC_CLIENT_SECRET
                  optional: true
            - name: UPSTREAM_OIDC_ISSUER
              value: https://idp.example.org
            - name: UPSTREAM_OIDC_AUTH_URL
              value: https://idp.example.org/authorize
            - name: UPSTREAM_OIDC_TOKEN_URL
              value: https://idp.example.org/token
            - name: UPSTREAM_OIDC_USERINFO_URL
              value: https://idp.example.org/userinfo
            - name: UPSTREAM_OIDC_JWKS_URL
              value: https://idp.example.org/jwks
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              for value in "$KC_DB_PASSWORD" "$KC_BOOTSTRAP_ADMIN_PASSWORD" "$KEYCLOAK_CHRONICLE_CLIENT_SECRET"; do
                case "$value" in ''|change-me-*|CHANGE_ME*) echo "FATAL: replace default Keycloak secrets" >&2; exit 1 ;; esac
              done
              if [ "$CHRONICLE_SECURITY_REQUIRE_MFA" = "true" ] && [ "$KEYCLOAK_DEFAULT_IDP" = "upstream-saml" ]; then
                echo "FATAL: MFA enforcement cannot use the disabled upstream SAML example until current-session AuthnContext is mapped to approved amr/acr assurance" >&2
                exit 1
              fi
              if [ "$CHRONICLE_SECURITY_MFA_IDP_PROOF_VERIFIED" != "true" ]; then
                echo "FATAL: production requires verified live current-session MFA IdP proof" >&2
                exit 1
              fi
              if [ "$KEYCLOAK_DEFAULT_IDP" = "upstream-oidc" ]; then
                for value in "$UPSTREAM_OIDC_CLIENT_ID" "${UPSTREAM_OIDC_CLIENT_SECRET:-}"; do
                  case "$value" in
                    ''|change-me-*|CHANGE_ME*|disabled*)
                      echo "FATAL: upstream-oidc requires provisioned Upstream OIDC client credentials" >&2
                      exit 1
                      ;;
                  esac
                done
              fi
              mkdir -p /opt/keycloak/data/import
              sed \
                -e "s|__REALM__|$KEYCLOAK_REALM|g" \
                -e "s|__CLIENT_ID__|$KEYCLOAK_CHRONICLE_CLIENT_ID|g" \
                -e "s|__CLIENT_SECRET__|$KEYCLOAK_CHRONICLE_CLIENT_SECRET|g" \
                -e "s|__DOMAIN__|$DOMAIN|g" \
                -e "s|__UPSTREAM_OIDC_CLIENT_ID__|$UPSTREAM_OIDC_CLIENT_ID|g" \
                -e "s|__UPSTREAM_OIDC_CLIENT_SECRET__|${UPSTREAM_OIDC_CLIENT_SECRET:-disabled}|g" \
                -e "s|__UPSTREAM_OIDC_ISSUER__|$UPSTREAM_OIDC_ISSUER|g" \
                -e "s|__UPSTREAM_OIDC_AUTH_URL__|$UPSTREAM_OIDC_AUTH_URL|g" \
                -e "s|__UPSTREAM_OIDC_TOKEN_URL__|$UPSTREAM_OIDC_TOKEN_URL|g" \
                -e "s|__UPSTREAM_OIDC_USERINFO_URL__|$UPSTREAM_OIDC_USERINFO_URL|g" \
                -e "s|__UPSTREAM_OIDC_JWKS_URL__|$UPSTREAM_OIDC_JWKS_URL|g" \
                /opt/keycloak/import-template/realm-chronicle.json.template > /opt/keycloak/data/import/realm-chronicle.json
              exec /opt/keycloak/bin/kc.sh start \
                --optimized \
                --import-realm \
                --http-enabled=true \
                --hostname="$KEYCLOAK_PUBLIC_URL" \
                --proxy-headers=xforwarded
          startupProbe:
            httpGet:
              path: /keycloak/health/ready
              port: management
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /keycloak/health/ready
              port: management
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /keycloak/health/live
              port: management
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: realm-template
              mountPath: /opt/keycloak/import-template
              readOnly: true
            - name: data
              mountPath: /opt/keycloak/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: realm-template
          configMap:
            name: keycloak-realm-template
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
