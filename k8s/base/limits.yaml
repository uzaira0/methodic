apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: chronicle
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "4"
        memory: 4Gi
    - type: Pod
      max:
        cpu: "6"
        memory: 6Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: resource-quota
  namespace: chronicle
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 5Gi
    limits.cpu: "9"
    limits.memory: 11Gi
    pods: "30"
    requests.storage: 260Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chronicle-backend
  namespace: chronicle
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chronicle-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chronicle-frontend
  namespace: chronicle
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chronicle-frontend
