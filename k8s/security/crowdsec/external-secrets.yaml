apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chronicle-crowdsec
  namespace: chronicle-security
  labels:
    app.kubernetes.io/name: chronicle-crowdsec
    app.kubernetes.io/part-of: chronicle
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: chronicle-crowdsec-secrets
    creationPolicy: Owner
  data:
    - secretKey: CROWDSEC_BOUNCER_API_KEY
      remoteRef:
        key: production/chronicle/crowdsec
        property: bouncer_api_key
