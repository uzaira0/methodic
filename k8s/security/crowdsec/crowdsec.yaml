apiVersion: v1
kind: Service
metadata:
  name: chronicle-crowdsec
  namespace: chronicle-security
  labels:
    app.kubernetes.io/name: chronicle-crowdsec
    app.kubernetes.io/part-of: chronicle
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: chronicle-crowdsec
  ports:
    - name: lapi
      port: 8080
      targetPort: lapi
    - name: appsec
      port: 7422
      targetPort: appsec
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chronicle-crowdsec
  namespace: chronicle-security
  labels:
    app.kubernetes.io/name: chronicle-crowdsec
    app.kubernetes.io/part-of: chronicle
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chronicle-crowdsec-config
  namespace: chronicle-security
  labels:
    app.kubernetes.io/name: chronicle-crowdsec
    app.kubernetes.io/part-of: chronicle
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chronicle-crowdsec-data
  namespace: chronicle-security
  labels:
    app.kubernetes.io/name: chronicle-crowdsec
    app.kubernetes.io/part-of: chronicle
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chronicle-traefik-access-logs
  namespace: chronicle-security
  labels:
    app.kubernetes.io/name: chronicle-crowdsec
    app.kubernetes.io/part-of: chronicle
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronicle-crowdsec
  namespace: chronicle-security
  labels:
    app.kubernetes.io/name: chronicle-crowdsec
    app.kubernetes.io/part-of: chronicle
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chronicle-crowdsec
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chronicle-crowdsec
        app.kubernetes.io/part-of: chronicle
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      serviceAccountName: chronicle-crowdsec
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-crowdsec-config
          image: crowdsecurity/crowdsec:v1.7.8@sha256:2f527c9bb8b367120eb08b82890aa912ce96bfa1ada93dda0721700e4b4e0dde
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              if [ ! -s /crowdsec-config/config.yaml ]; then
                cp -a /etc/crowdsec/. /crowdsec-config/
              fi
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: crowdsec-config
              mountPath: /crowdsec-config
            - name: tmp
              mountPath: /tmp
      containers:
        - name: crowdsec
          image: crowdsecurity/crowdsec:v1.7.8@sha256:2f527c9bb8b367120eb08b82890aa912ce96bfa1ada93dda0721700e4b4e0dde
          imagePullPolicy: IfNotPresent
          env:
            - name: COLLECTIONS
              value: crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
            - name: DISABLE_ONLINE_API
              value: "true"
            - name: BOUNCER_KEY_traefik
              valueFrom:
                secretKeyRef:
                  name: chronicle-crowdsec-secrets
                  key: CROWDSEC_BOUNCER_API_KEY
          ports:
            - name: lapi
              containerPort: 8080
            - name: appsec
              containerPort: 7422
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - cscli lapi status >/dev/null && nc -z 127.0.0.1 7422
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 8
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - cscli lapi status >/dev/null && nc -z 127.0.0.1 7422
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: crowdsec-config
              mountPath: /etc/crowdsec
            - name: crowdsec-data
              mountPath: /var/lib/crowdsec/data
            - name: static-config
              mountPath: /etc/crowdsec/acquis.yaml
              subPath: acquis.yaml
              readOnly: true
            - name: static-config
              mountPath: /etc/crowdsec/acquis.d/appsec.yaml
              subPath: appsec.yaml
              readOnly: true
            - name: static-config
              mountPath: /etc/crowdsec/postoverflows/s01-whitelist/geo-block.yaml
              subPath: geo-block.yaml
              readOnly: true
            - name: traefik-access-logs
              mountPath: /var/log/traefik
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
      volumes:
        - name: crowdsec-config
          persistentVolumeClaim:
            claimName: chronicle-crowdsec-config
        - name: crowdsec-data
          persistentVolumeClaim:
            claimName: chronicle-crowdsec-data
        - name: traefik-access-logs
          persistentVolumeClaim:
            claimName: chronicle-traefik-access-logs
            readOnly: true
        - name: static-config
          configMap:
            name: chronicle-crowdsec-config
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: run
          emptyDir:
            sizeLimit: 32Mi
