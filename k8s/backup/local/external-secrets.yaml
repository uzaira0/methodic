apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chronicle-backup
  namespace: chronicle
  labels:
    app.kubernetes.io/name: chronicle-local-backup
    app.kubernetes.io/part-of: chronicle
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: chronicle-backup-secrets
    creationPolicy: Owner
  data:
    - secretKey: BACKUP_ENCRYPTION_PASSPHRASE
      remoteRef:
        key: production/chronicle/backup
        property: encryption_passphrase
