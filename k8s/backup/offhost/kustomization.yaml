apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: chronicle

resources:
  - ../local
  - offhost-export.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: chronicle

configMapGenerator:
  - name: chronicle-offhost-backup-export-scripts
    files:
      - export-latest.sh=scripts/export-latest.sh
  - name: chronicle-offhost-backup-export-evidence
    literals:
      - export_profile=chronicle-k8s-offhost-export-v1
      - target_name=REPLACE_WITH_APPROVED_BACKUP_TARGET
      - storage_scope=off-host-or-operator-managed-storage
      - production_cutover_requirement=off-host-export-or-pitr-restore-evidence
      - max_backup_age_hours=25
