apiVersion: 1

policies:
  - orgId: 1
    receiver: chronicle-local-placeholder
    group_by:
      - alertname
      - severity
      - service
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: chronicle-local-placeholder
        object_matchers:
          - ["severity", "=", "critical"]
        group_wait: 15s
        group_interval: 2m
        repeat_interval: 1h
      - receiver: chronicle-local-placeholder
        object_matchers:
          - ["team", "=", "chronicle-platform"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
