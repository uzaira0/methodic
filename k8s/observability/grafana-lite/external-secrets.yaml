apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: chronicle-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: chronicle
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: production/chronicle/grafana
        property: admin_password
