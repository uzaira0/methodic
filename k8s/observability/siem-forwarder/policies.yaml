apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chronicle-siem-forwarder-egress
  namespace: chronicle-observability
  labels:
    app.kubernetes.io/name: chronicle-siem-forwarder
    app.kubernetes.io/part-of: chronicle
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chronicle-siem-forwarder
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chronicle-siem-forwarder-ingress
  namespace: chronicle-observability
  labels:
    app.kubernetes.io/name: chronicle-siem-forwarder
    app.kubernetes.io/part-of: chronicle
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chronicle-siem-forwarder
  policyTypes:
    - Ingress
  ingress: []
