apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chronicle-siem-forwarder
  namespace: chronicle-observability
  labels:
    app.kubernetes.io/name: chronicle-siem-forwarder
    app.kubernetes.io/part-of: chronicle
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: chronicle-siem-forwarder-secrets
    creationPolicy: Owner
  data:
    - secretKey: SIEM_HOST
      remoteRef:
        key: production/chronicle/siem
        property: host
    - secretKey: SIEM_PORT
      remoteRef:
        key: production/chronicle/siem
        property: port
    - secretKey: SIEM_URI
      remoteRef:
        key: production/chronicle/siem
        property: uri
    - secretKey: SIEM_AUTHORIZATION_HEADER
      remoteRef:
        key: production/chronicle/siem
        property: authorization_header
