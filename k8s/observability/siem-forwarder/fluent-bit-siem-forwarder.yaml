apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronicle-siem-forwarder
  namespace: chronicle-observability
  labels:
    app.kubernetes.io/name: chronicle-siem-forwarder
    app.kubernetes.io/part-of: chronicle
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: chronicle-siem-forwarder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chronicle-siem-forwarder
        app.kubernetes.io/part-of: chronicle
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:4.2.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              case "${SIEM_HOST:-}" in
                ""|REPLACE_*|CHANGEME*|localhost|127.0.0.1)
                  echo "FATAL: SIEM_HOST must identify the approved operator SIEM endpoint" >&2
                  exit 1
                  ;;
              esac
              case "${SIEM_PORT:-}" in
                ''|*[!0-9]*)
                  echo "FATAL: SIEM_PORT must be numeric" >&2
                  exit 1
                  ;;
              esac
              case "${SIEM_URI:-}" in
                /*) ;;
                *)
                  echo "FATAL: SIEM_URI must be an absolute HTTP path" >&2
                  exit 1
                  ;;
              esac
              if [ -z "${SIEM_AUTHORIZATION_HEADER:-}" ]; then
                echo "FATAL: SIEM_AUTHORIZATION_HEADER must come from the approved secret store" >&2
                exit 1
              fi
              exec /fluent-bit/bin/fluent-bit -c /fluent-bit/etc/fluent-bit.conf
          envFrom:
            - secretRef:
                name: chronicle-siem-forwarder-secrets
          ports:
            - name: http
              containerPort: 2020
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/parsers.conf
              subPath: parsers.conf
              readOnly: true
            - name: audit-logs
              mountPath: /var/log/chronicle
              readOnly: true
            - name: state
              mountPath: /fluent-bit/state
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: chronicle-siem-forwarder-config
            defaultMode: 0440
        - name: audit-logs
          persistentVolumeClaim:
            claimName: chronicle-audit-logs
            readOnly: true
        - name: state
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chronicle-siem-forwarder
  namespace: chronicle-observability
  labels:
    app.kubernetes.io/name: chronicle-siem-forwarder
    app.kubernetes.io/part-of: chronicle
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: chronicle-siem-forwarder
  ports:
    - name: http
      port: 2020
      targetPort: http
