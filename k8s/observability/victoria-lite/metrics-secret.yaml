apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chronicle-metrics-scrape
  namespace: chronicle-observability
  labels:
    app.kubernetes.io/name: victoria-metrics
    app.kubernetes.io/part-of: chronicle
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: chronicle-metrics-scrape
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: production/chronicle/observability
        property: metrics_password
