apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
  namespace: chronicle-observability
  labels:
    app.kubernetes.io/name: victoria-metrics
    app.kubernetes.io/part-of: chronicle
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: victoria-metrics
  ports:
    - name: http
      port: 8428
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoria-metrics
  namespace: chronicle-observability
  labels:
    app.kubernetes.io/name: victoria-metrics
    app.kubernetes.io/part-of: chronicle
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics
  namespace: chronicle-observability
  labels:
    app.kubernetes.io/name: victoria-metrics
    app.kubernetes.io/part-of: chronicle
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-metrics
        app.kubernetes.io/part-of: chronicle
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      serviceAccountName: victoria-metrics
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: victoria-metrics
          image: victoriametrics/victoria-metrics:v1.138.0-scratch@sha256:f154ce0d4c75da39f13a5a56734c91222d6dc65a1f11a1579fb2986250f25352
          imagePullPolicy: IfNotPresent
          args:
            - -storageDataPath=/victoria-metrics-data
            - -retentionPeriod=7d
            - -promscrape.config=/etc/victoriametrics/scrape.yml
            - -httpListenAddr=:8428
            - -memory.allowedPercent=20
            - -search.maxConcurrentRequests=2
          ports:
            - name: http
              containerPort: 8428
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          volumeMounts:
            - name: scrape-config
              mountPath: /etc/victoriametrics
              readOnly: true
            - name: metrics-credential
              mountPath: /run/secrets/chronicle-metrics
              readOnly: true
            - name: data
              mountPath: /victoria-metrics-data
            - name: tmp
              mountPath: /tmp
        - name: credential-reloader
          image: alpine:3.23@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              while true; do
                sleep 15
                until wget -qO- -T 5 http://127.0.0.1:8428/-/reload >/dev/null; do
                  sleep 2
                done
              done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
      volumes:
        - name: scrape-config
          configMap:
            name: victoria-metrics-scrape
        - name: metrics-credential
          secret:
            secretName: chronicle-metrics-scrape
            defaultMode: 0440
        - name: data
          persistentVolumeClaim:
            claimName: victoria-metrics-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-metrics-data
  namespace: chronicle-observability
  labels:
    app.kubernetes.io/name: victoria-metrics
    app.kubernetes.io/part-of: chronicle
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
