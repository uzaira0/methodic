apiVersion: v1
kind: Namespace
metadata:
  name: chronicle-observability
  labels:
    app.kubernetes.io/name: chronicle-observability
    app.kubernetes.io/part-of: chronicle
    chronicle.io/observability: victoria-lite
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: observability-quota
  namespace: chronicle-observability
  labels:
    app.kubernetes.io/name: chronicle-observability
    app.kubernetes.io/part-of: chronicle
spec:
  hard:
    requests.cpu: "275m"
    requests.memory: 384Mi
    limits.cpu: "1500m"
    limits.memory: 1200Mi
    pods: "7"
    persistentvolumeclaims: "2"
    requests.storage: 10Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: observability-defaults
  namespace: chronicle-observability
  labels:
    app.kubernetes.io/name: chronicle-observability
    app.kubernetes.io/part-of: chronicle
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 25m
        memory: 64Mi
