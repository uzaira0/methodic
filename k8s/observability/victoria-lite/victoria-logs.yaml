apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  namespace: chronicle-observability
  labels:
    app.kubernetes.io/name: victoria-logs
    app.kubernetes.io/part-of: chronicle
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: victoria-logs
  ports:
    - name: http
      port: 9428
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoria-logs
  namespace: chronicle-observability
  labels:
    app.kubernetes.io/name: victoria-logs
    app.kubernetes.io/part-of: chronicle
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs
  namespace: chronicle-observability
  labels:
    app.kubernetes.io/name: victoria-logs
    app.kubernetes.io/part-of: chronicle
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-logs
        app.kubernetes.io/part-of: chronicle
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      serviceAccountName: victoria-logs
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: victoria-logs
          image: victoriametrics/victoria-logs:v1.50.0@sha256:ae9bea8d8a3b0fc47c7f0058bcca410e79c84b4a0acd12d4dac71b9302526590
          imagePullPolicy: IfNotPresent
          args:
            - -storageDataPath=/victoria-logs-data
            - -retentionPeriod=7d
            - -httpListenAddr=:9428
            - -memory.allowedPercent=20
          ports:
            - name: http
              containerPort: 9428
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          volumeMounts:
            - name: data
              mountPath: /victoria-logs-data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victoria-logs-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-logs-data
  namespace: chronicle-observability
  labels:
    app.kubernetes.io/name: victoria-logs
    app.kubernetes.io/part-of: chronicle
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
