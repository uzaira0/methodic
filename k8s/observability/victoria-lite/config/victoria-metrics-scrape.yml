global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: chronicle-backend
    metrics_path: /prometheus/
    scheme: http
    basic_auth:
      username: chronicle-metrics
      password_file: /run/secrets/chronicle-metrics/password
    static_configs:
      - targets:
          - chronicle-backend.chronicle.svc.cluster.local:40320
        labels:
          application: chronicle
          namespace: chronicle
          service: chronicle-backend
