apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: chronicle
  namespace: chronicle
  annotations:
    chronicle.openlattice.com/edge-owner: "Operator-managed DNS/TLS/WAF; Chronicle owns the private HTTP route interface only"
    chronicle.openlattice.com/tls-scope: "TLS terminates at the operator-managed edge; this Gateway does not issue or renew public certificates"
spec:
  addresses:
    - type: IPAddress
      value: "REPLACE_WITH_DEDICATED_SERVER_LB_IP"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: chronicle.example.com
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chronicle
  namespace: chronicle
  annotations:
    chronicle.openlattice.com/edge-owner: "Operator-managed DNS/TLS/WAF; Chronicle owns route, header, health, upload, and privacy proof"
    chronicle.openlattice.com/public-edge-scope: "Route contract only; public DNS, TLS, load balancing, and WAF are operator-managed"
spec:
  hostnames:
    - chronicle.example.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronicle-backend
  namespace: chronicle
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: DOMAIN
              value: chronicle.example.com
            - name: OIDC_PUBLIC_BASE_URL
              value: https://chronicle.example.com/chronicle/auth
            - name: OIDC_ISSUER
              value: https://chronicle.example.com/chronicle/auth/realms/chronicle
            - name: OIDC_AUTHORIZATION_URI
              value: https://chronicle.example.com/chronicle/auth/realms/chronicle/protocol/openid-connect/auth
