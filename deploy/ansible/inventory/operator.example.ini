# Example operator inventory for Chronicle RHEL 9 Kubernetes hosts.
#
# Copy this file to an untracked inventory such as:
#
#   inventory/operator-production.local.ini
#
# Replace every CHANGEME value with operator-provided hostnames/IPs/accounts.
# Do not commit the copied inventory if it contains real internal addresses,
# usernames, SSH key paths, ticket numbers, or other sensitive operational
# details.
#
# The first production target is a single Kubernetes node. The fallback server
# is PHI/ePHI-capable and should be validated as a restore target, but it is not
# part of the primary Kubernetes control plane unless the operator explicitly approves a
# multi-node design later.

[chronicle_k8s_primary]
operator-production ansible_host=CHANGEME_PROD_HOST_OR_IP ansible_user=CHANGEME_OPERATOR_USER

[chronicle_k8s_fallback]
operator-fallback ansible_host=CHANGEME_FALLBACK_HOST_OR_IP ansible_user=CHANGEME_OPERATOR_USER

[chronicle_k8s:children]
chronicle_k8s_primary

[chronicle_restore_targets:children]
chronicle_k8s_fallback

[chronicle_k8s:vars]
ansible_become=true
chronicle_profile=operator-production
chronicle_hostname=CHANGEME_PROD_FQDN
chronicle_public_ip=CHANGEME_PUBLIC_SERVICE_IP
chronicle_private_ip=CHANGEME_PROD_PRIVATE_IP
chronicle_disable_firewalld_for_single_node_cni=false

[chronicle_restore_targets:vars]
ansible_become=true
chronicle_profile=operator-fallback
chronicle_hostname=CHANGEME_FALLBACK_FQDN
chronicle_public_ip=CHANGEME_FALLBACK_SERVICE_IP_OR_PRIVATE_IP
chronicle_private_ip=CHANGEME_FALLBACK_PRIVATE_IP
chronicle_disable_firewalld_for_single_node_cni=false
