    namespaces = {{ chronicle_configmap_sensitive_key_namespaces | to_json }}
    failures = []

    def is_sensitive_key(name):
        upper = name.upper().replace("-", "_").replace(".", "_")
        if upper.endswith(("_TOKEN_URI", "_TOKEN_URL", "_TOKEN_CLAIM", "_TOKEN_EXPIRY_MINUTES", "_TOKEN_EXPIRY_DAYS")):
