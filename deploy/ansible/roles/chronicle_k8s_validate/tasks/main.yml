            )
        except subprocess.CalledProcessError:
            failures.append(f"{kind}/{name}: public route missing")
            return {}
        return json.loads(raw)

    def host_values(match):
        return re.findall(r"Host\(`([^`]+)`\)", match or "")

    for contract in contracts:
