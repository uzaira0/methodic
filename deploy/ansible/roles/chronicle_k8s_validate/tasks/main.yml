- name: Validate there are no unresolved recent Kubernetes warning events
  ansible.builtin.shell: |
    set -euo pipefail
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }} get events -A \
      --field-selector type=Warning -o json | python3 -c '
    import datetime as dt
    import json
    import subprocess
    import sys

    kubectl = "{{ chronicle_kubectl }}"
    kubeconfig = "{{ chronicle_kubeconfig }}"
    namespace = "{{ chronicle_namespace }}"
    observability_namespace = "{{ chronicle_observability_namespace }}"
    expected_deployments = set({{ chronicle_expected_deployments | to_json }})
    expected_observability_deployments = set({{ chronicle_expected_observability_deployments | to_json }})
    deployment_namespaces = {
        namespace: expected_deployments,
        observability_namespace: expected_observability_deployments,
    }
    backup_cronjobs = set(
        contract.get("name")
        for contract in {{ chronicle_backup_cronjob_contracts | to_json }}
        if contract.get("name")
    )
    lookback_minutes = int({{ chronicle_k8s_warning_event_lookback_minutes }})
    reboot_grace_minutes = int({{ chronicle_k8s_warning_event_reboot_grace_minutes }})
    cutoff = dt.datetime.now(dt.timezone.utc) - dt.timedelta(minutes=lookback_minutes)
    payload = json.load(sys.stdin)
    offenders = []
    ignored = []

    def parse_time(value):
        if not value:
            return None
        text = value.replace("Z", "+00:00")
        try:
            return dt.datetime.fromisoformat(text)
        except ValueError:
            return None

    def event_timestamp(item):
        return (
            parse_time(item.get("series", {}).get("lastObservedTime"))
            or parse_time(item.get("eventTime"))
            or parse_time(item.get("lastTimestamp"))
            or parse_time(item.get("metadata", {}).get("creationTimestamp"))
        )

    def kjson(args):
        return json.loads(
            subprocess.check_output(
                [kubectl, "--kubeconfig", kubeconfig, *args],
                text=True,
                stderr=subprocess.DEVNULL,
            )
        )

    deployment_status = {}
    for deployment_namespace, deployments in deployment_namespaces.items():
        for deployment in deployments:
            key = (deployment_namespace, deployment)
            try:
                obj = kjson(["-n", deployment_namespace, "get", "deploy", deployment, "-o", "json"])
            except subprocess.CalledProcessError:
                deployment_status[key] = False
                continue
            spec_replicas = int(obj.get("spec", {}).get("replicas", 1))
            status = obj.get("status", {})
            conditions = {
                condition.get("type"): condition.get("status")
                for condition in status.get("conditions", [])
            }
            deployment_status[key] = (
                status.get("observedGeneration") == obj.get("metadata", {}).get("generation")
                and int(status.get("updatedReplicas", 0)) == spec_replicas
                and int(status.get("availableReplicas", 0)) >= spec_replicas
                and conditions.get("Available") == "True"
            )

    ready_pods = set()
    for pod in kjson(["get", "pods", "-A", "-o", "json"]).get("items", []):
        metadata = pod.get("metadata", {})
        status = pod.get("status", {})
        if status.get("phase") != "Running":
            continue
        container_statuses = status.get("containerStatuses", [])
        if container_statuses and all(container.get("ready") is True for container in container_statuses):
            ready_pods.add((metadata.get("namespace", ""), metadata.get("name", "")))

    reboot_until = None
    for item in payload.get("items", []):
        involved = item.get("involvedObject", {}) or item.get("regarding", {})
        if item.get("reason") != "Rebooted" or involved.get("kind") != "Node":
            continue
        timestamp = event_timestamp(item)
        if timestamp is None:
            continue
        grace_until = timestamp + dt.timedelta(minutes=reboot_grace_minutes)
        if reboot_until is None or grace_until > reboot_until:
            reboot_until = grace_until

    def owning_deployment(namespace_value, replica_set_name):
        for deployment in deployment_namespaces.get(namespace_value, set()):
            if replica_set_name.startswith(deployment + "-"):
                return deployment
        return None

    for item in payload.get("items", []):
        timestamp = event_timestamp(item)
        if timestamp is None or timestamp < cutoff:
            continue
        metadata = item.get("metadata", {})
        involved = item.get("involvedObject", {})
        if not involved:
            involved = item.get("regarding", {})
        namespace_value = metadata.get("namespace", "")
        kind = involved.get("kind", "")
        name = involved.get("name", "")
        reason = item.get("reason", "")
        message = item.get("message", "")[:220]
        line = (
            f"{timestamp.isoformat()} {namespace_value}/{kind}/{name}: "
            f"{reason} {message}"
        )

        if reason == "Rebooted" and kind == "Node":
            ignored.append(line + " [node reboot event]")
            continue
        if reboot_until is not None and timestamp <= reboot_until:
            ignored.append(line + " [within reboot grace]")
            continue
        if kind == "Pod" and reason in ("BackOff", "Unhealthy") and (namespace_value, name) in ready_pods:
            ignored.append(line + " [pod is now running and ready]")
            continue
        if (
            kind == "Pod"
            and reason == "Failed"
            and (namespace_value, name) in ready_pods
            and (
                "Failed to pull image" in message
                or "ErrImagePull" in message
                or "ImagePullBackOff" in message
            )
        ):
            ignored.append(line + " [image pull failure remediated; pod is now running and ready]")
            continue
        if (
            namespace_value == namespace
            and kind == "CronJob"
            and reason == "UnexpectedJob"
            and name in backup_cronjobs
            and any(
                f"{name}-{operator_suffix}-" in message
                for operator_suffix in ("ansible", "manual", "recovery")
            )
        ):
            ignored.append(line + " [expected operator-created backup drill job]")
            continue
        owner = owning_deployment(namespace_value, name) if kind in ("Pod", "ReplicaSet") else None
        owner_key = (namespace_value, owner) if owner else None
        if reason == "Unhealthy" and owner and deployment_status.get(owner_key):
            ignored.append(line + f" [deployment/{owner} is now rolled out]")
            continue
        if reason == "FailedCreate" and owner and deployment_status.get(owner_key):
            ignored.append(line + f" [deployment/{owner} is now rolled out]")
            continue

        offenders.append(line)

    if ignored:
        print("ignored remediated warning events:\n" + "\n".join(ignored))
    if offenders:
        print("Unresolved recent Kubernetes warning events:\n" + "\n".join(offenders), file=sys.stderr)
        sys.exit(1)
    print(f"no unresolved warning events in the last {lookback_minutes} minutes")
    '
  args:
    executable: /bin/bash
  changed_when: false
  when: chronicle_manage_k8s_recent_warning_event_validation | bool

