- name: Validate active workload requests fit node capacity
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    import re
    import subprocess
    import sys

    kubectl = "{{ chronicle_kubectl }}"
    kubeconfig = "{{ chronicle_kubeconfig }}"
    namespaces = {{ chronicle_capacity_namespaces | to_json }}
    max_request_cpu = float({{ chronicle_capacity_max_request_cpu_percent }})
    max_request_memory = float({{ chronicle_capacity_max_request_memory_percent }})
    max_limit_memory = float({{ chronicle_capacity_max_limit_memory_percent }})

    def kjson(args):
        return json.loads(subprocess.check_output([kubectl, "--kubeconfig", kubeconfig, *args], text=True))

    def cpu_millis(value):
        text = str(value)
        if text.endswith("m"):
            return int(text[:-1])
        return int(float(text) * 1000)

    def memory_mib(value):
        text = str(value)
        match = re.match(r"^([0-9.]+)([KMGTE]i?)?$", text)
        if not match:
            raise ValueError("unsupported memory quantity " + text)
        number = float(match.group(1))
        unit = match.group(2) or ""
        multipliers = {
            "": 1 / 1024 / 1024,
            "Ki": 1 / 1024,
            "Mi": 1,
            "Gi": 1024,
            "Ti": 1024 * 1024,
            "K": 1000 / 1024 / 1024,
            "M": 1000 / 1024,
            "G": 1000,
            "T": 1000 * 1000,
        }
        return int(number * multipliers[unit])

    nodes = kjson(["get", "nodes", "-o", "json"]).get("items", [])
    alloc_cpu = sum(cpu_millis(node["status"]["allocatable"]["cpu"]) for node in nodes)
    alloc_memory = sum(memory_mib(node["status"]["allocatable"]["memory"]) for node in nodes)

    request_cpu = request_memory = limit_memory = 0
    active_pods = 0
    for namespace in namespaces:
        pods = kjson(["-n", namespace, "get", "pods", "-o", "json"]).get("items", [])
        for pod in pods:
            phase = pod.get("status", {}).get("phase")
            if phase in ("Succeeded", "Failed"):
                continue
            active_pods += 1
            for container in pod.get("spec", {}).get("initContainers", []) + pod.get("spec", {}).get("containers", []):
                resources = container.get("resources", {})
                requests = resources.get("requests", {})
                limits = resources.get("limits", {})
                request_cpu += cpu_millis(requests.get("cpu", "0"))
                request_memory += memory_mib(requests.get("memory", "0"))
                limit_memory += memory_mib(limits.get("memory", "0"))

    failures = []
    request_cpu_percent = request_cpu / alloc_cpu * 100 if alloc_cpu else 100
    request_memory_percent = request_memory / alloc_memory * 100 if alloc_memory else 100
    limit_memory_percent = limit_memory / alloc_memory * 100 if alloc_memory else 100

    if request_cpu_percent > max_request_cpu:
        failures.append(f"active CPU requests {request_cpu_percent:.1f}% exceed {max_request_cpu:.1f}% of node allocatable")
    if request_memory_percent > max_request_memory:
        failures.append(f"active memory requests {request_memory_percent:.1f}% exceed {max_request_memory:.1f}% of node allocatable")
    if limit_memory_percent > max_limit_memory:
        failures.append(f"active memory limits {limit_memory_percent:.1f}% exceed {max_limit_memory:.1f}% of node allocatable")

    print(
        f"active_pods={active_pods} "
        f"request_cpu={request_cpu}m/{alloc_cpu}m({request_cpu_percent:.1f}%) "
        f"request_memory={request_memory}Mi/{alloc_memory}Mi({request_memory_percent:.1f}%) "
        f"limit_memory={limit_memory}Mi/{alloc_memory}Mi({limit_memory_percent:.1f}%)"
    )
    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    PY
  args:
    executable: /bin/bash
  changed_when: false

