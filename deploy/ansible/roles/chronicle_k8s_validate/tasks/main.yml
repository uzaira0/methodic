- name: Validate local backup artifact permissions and encrypted-only contents
  ansible.builtin.shell: |
    set -euo pipefail
    pv="$({{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }} \
      -n {{ chronicle_namespace }} get pvc chronicle-local-backups -o jsonpath='{.spec.volumeName}')"
    backup_root="$({{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }} \
      get pv "$pv" -o jsonpath='{.spec.hostPath.path}')"
    python3 - "$backup_root" <<'PY'
    import os
    import re
    import stat
    import sys

    backup_root = sys.argv[1]
    failures = []
    timestamp_re = re.compile(r"^\d{8}T\d{6}Z$")
    allowed_files = {
        "database.dump.enc",
        "tde-keyring.tar.gz.enc",
        "audit-logs.tar.gz.enc",
        "deployment-evidence.tar.gz.enc",
        "artifact-sha256sums.txt",
        "manifest.json",
        "manifest.json.sha256",
    }
    plaintext_suffixes = (".dump", ".sql", ".tar", ".tar.gz", ".key", ".pem")

    if not backup_root:
        failures.append("backup PVC hostPath is empty")
    elif not os.path.isdir(backup_root):
        failures.append(f"{backup_root}: backup PVC hostPath is not a directory")
    else:
        latest = os.path.join(backup_root, "latest")
        if not os.path.islink(latest):
            failures.append(f"{latest}: latest backup symlink missing")
        else:
            resolved = os.path.realpath(latest)
            if not resolved.startswith(os.path.realpath(backup_root) + os.sep):
                failures.append(f"{latest}: symlink resolves outside backup root")
            if not os.path.isdir(resolved):
                failures.append(f"{latest}: symlink target is not a directory")

        backup_dirs = []
        for entry in sorted(os.listdir(backup_root)):
            path = os.path.join(backup_root, entry)
            if entry == "latest":
                continue
            if timestamp_re.match(entry):
                if not os.path.isdir(path) or os.path.islink(path):
                    failures.append(f"{path}: timestamped backup entry must be a directory")
                    continue
                backup_dirs.append(path)
                mode = stat.S_IMODE(os.stat(path).st_mode)
                if mode & 0o077:
                    failures.append(f"{path}: mode {mode:04o} grants group/other access")
            else:
                failures.append(f"{path}: unexpected top-level backup entry")

        if not backup_dirs:
            failures.append(f"{backup_root}: no timestamped backup directories found")

        for backup_dir in backup_dirs:
            for root, dirs, files in os.walk(backup_dir):
                for dirname in dirs:
                    path = os.path.join(root, dirname)
                    mode = stat.S_IMODE(os.stat(path).st_mode)
                    if mode & 0o077:
                        failures.append(f"{path}: mode {mode:04o} grants group/other access")
                for filename in files:
                    path = os.path.join(root, filename)
                    rel = os.path.relpath(path, backup_dir)
                    if os.path.islink(path):
                        failures.append(f"{path}: backup files must not be symlinks")
                        continue
                    mode = stat.S_IMODE(os.stat(path).st_mode)
                    if mode & 0o077:
                        failures.append(f"{path}: mode {mode:04o} grants group/other access")
                    if rel != filename:
                        failures.append(f"{path}: nested backup files are not expected")
                    if filename not in allowed_files:
                        failures.append(f"{path}: unexpected backup artifact name")
                    if filename.endswith(plaintext_suffixes) and not filename.endswith(".enc"):
                        failures.append(f"{path}: plaintext backup-like artifact found")

    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    print("local backup artifacts validated: encrypted-only names, private modes, valid latest symlink")
    PY
  args:
    executable: /bin/bash
  changed_when: false

- name: Validate local backup manifests and artifact hashes
  ansible.builtin.shell: |
    set -euo pipefail
    pv="$({{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }} \
      -n {{ chronicle_namespace }} get pvc chronicle-local-backups -o jsonpath='{.spec.volumeName}')"
    backup_root="$({{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }} \
      get pv "$pv" -o jsonpath='{.spec.hostPath.path}')"
    python3 - "$backup_root" <<'PY'
    import hashlib
    import json
    import os
    import re
    import sys

    backup_root = sys.argv[1]
    failures = []
    timestamp_re = re.compile(r"^\d{8}T\d{6}Z$")
    required_artifacts = {
        "database.dump.enc",
        "tde-keyring.tar.gz.enc",
        "audit-logs.tar.gz.enc",
        "deployment-evidence.tar.gz.enc",
    }

    def sha256(path):
        digest = hashlib.sha256()
        with open(path, "rb") as handle:
            for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                digest.update(chunk)
        return digest.hexdigest()

    if not backup_root or not os.path.isdir(backup_root):
        failures.append(f"{backup_root or '<empty>'}: backup root missing")
    else:
        backup_dirs = [
            os.path.join(backup_root, entry)
            for entry in sorted(os.listdir(backup_root))
            if timestamp_re.match(entry) and os.path.isdir(os.path.join(backup_root, entry))
        ]
        if not backup_dirs:
            failures.append(f"{backup_root}: no timestamped backup directories found")

        for backup_dir in backup_dirs:
            manifest_path = os.path.join(backup_dir, "manifest.json")
            manifest_sum_path = os.path.join(backup_dir, "manifest.json.sha256")
            if not os.path.isfile(manifest_path):
                failures.append(f"{manifest_path}: missing")
                continue
            if not os.path.isfile(manifest_sum_path):
                failures.append(f"{manifest_sum_path}: missing")
                continue

            try:
                manifest = json.load(open(manifest_path, encoding="utf-8"))
            except Exception as exc:
                failures.append(f"{manifest_path}: invalid JSON: {exc}")
                continue

            expected_manifest_sum = open(manifest_sum_path, encoding="utf-8").read().split()[0]
            actual_manifest_sum = sha256(manifest_path)
            if expected_manifest_sum != actual_manifest_sum:
                failures.append(f"{manifest_path}: sha256 mismatch")

            encryption = manifest.get("encryption", {})
            if encryption.get("algorithm") != "aes-256-cbc":
                failures.append(f"{manifest_path}: unexpected encryption algorithm")
            if encryption.get("kdf") != "pbkdf2":
                failures.append(f"{manifest_path}: unexpected encryption KDF")
            if int(encryption.get("iterations", 0)) < 600000:
                failures.append(f"{manifest_path}: encryption iterations below 600000")

            artifacts = manifest.get("artifacts", {})
            missing = required_artifacts - set(artifacts)
            extra = set(artifacts) - required_artifacts
            if missing:
                failures.append(f"{manifest_path}: missing artifact hashes {sorted(missing)}")
            if extra:
                failures.append(f"{manifest_path}: unexpected artifact hashes {sorted(extra)}")
            for artifact, expected_hash in artifacts.items():
                artifact_path = os.path.join(backup_dir, artifact)
                if not os.path.isfile(artifact_path):
                    failures.append(f"{artifact_path}: artifact missing")
                    continue
                if sha256(artifact_path) != expected_hash:
                    failures.append(f"{artifact_path}: sha256 mismatch")

    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    print("local backup manifests validated: manifest checksum, encryption metadata, artifact hashes")
    PY
  args:
    executable: /bin/bash
  changed_when: false

- name: Validate latest local backup freshness
  ansible.builtin.shell: |
    set -euo pipefail
    pv="$({{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }} \
      -n {{ chronicle_namespace }} get pvc chronicle-local-backups -o jsonpath='{.spec.volumeName}')"
    backup_root="$({{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }} \
      get pv "$pv" -o jsonpath='{.spec.hostPath.path}')"
    python3 - "$backup_root" "{{ chronicle_backup_max_age_hours }}" <<'PY'
    import os
    import re
    import sys
    from datetime import datetime, timezone

    backup_root = sys.argv[1]
    max_age_hours = float(sys.argv[2])
    timestamp_re = re.compile(r"^\d{8}T\d{6}Z$")
    failures = []

    if max_age_hours <= 0:
        failures.append(f"invalid backup max age threshold: {max_age_hours}")

    if not backup_root or not os.path.isdir(backup_root):
        failures.append(f"{backup_root or '<empty>'}: backup root missing")
    else:
        latest = os.path.join(backup_root, "latest")
        if not os.path.islink(latest):
            failures.append(f"{latest}: latest backup symlink missing")
        else:
            root_real = os.path.realpath(backup_root)
            latest_real = os.path.realpath(latest)
            if not latest_real.startswith(root_real + os.sep):
                failures.append(f"{latest}: symlink resolves outside backup root")
            if not os.path.isdir(latest_real):
                failures.append(f"{latest}: symlink target is not a directory")

            timestamp = os.path.basename(latest_real)
            if not timestamp_re.match(timestamp):
                failures.append(f"{latest_real}: latest backup directory is not timestamped")
            else:
                backup_time = datetime.strptime(timestamp, "%Y%m%dT%H%M%SZ").replace(tzinfo=timezone.utc)
                age_hours = (datetime.now(timezone.utc) - backup_time).total_seconds() / 3600
                if age_hours < 0:
                    failures.append(f"{latest_real}: latest backup timestamp is in the future")
                if age_hours > max_age_hours:
                    failures.append(
                        f"{latest_real}: latest backup age {age_hours:.2f}h exceeds {max_age_hours:.2f}h"
                    )

    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    print(f"latest local backup freshness validated: age_hours={age_hours:.2f} max_hours={max_age_hours:.2f}")
    PY
  args:
    executable: /bin/bash
  changed_when: false

- name: Validate backend health through public hostname
  ansible.builtin.uri:
    url: "https://{{ chronicle_hostname }}/health"
    validate_certs: false
    status_code: 200
    return_content: false
  register: chronicle_backend_health_response

- name: Validate public edge security headers on backend health
  ansible.builtin.assert:
    that:
      - chronicle_backend_health_response.x_content_type_options | default('') == 'nosniff'
      - chronicle_backend_health_response.x_frame_options | default('') == 'DENY'
      - chronicle_backend_health_response.referrer_policy | default('') == 'no-referrer'
      - "'max-age=31536000' in (chronicle_backend_health_response.strict_transport_security | default(''))"
      - "'camera=()' in (chronicle_backend_health_response.permissions_policy | default(''))"
    fail_msg: "Backend public edge security headers are missing or incomplete: {{ chronicle_backend_health_response }}"

- name: Validate Keycloak OIDC discovery through public hostname
  ansible.builtin.uri:
    url: "https://{{ chronicle_hostname }}/keycloak/realms/chronicle/.well-known/openid-configuration"
    validate_certs: false
    status_code: 200
    return_content: false

- name: Validate Keycloak admin path is blocked
  ansible.builtin.uri:
    url: "https://{{ chronicle_hostname }}/keycloak/admin"
    validate_certs: false
    status_code: 404
    return_content: false

- name: Validate approved APK download path
  ansible.builtin.uri:
    url: "https://{{ chronicle_hostname }}/chronicle/downloads/Chronicle-2026-06-25-beta.2-debug.apk"
    method: HEAD
    validate_certs: false
    status_code: 200
    return_content: false
  register: chronicle_apk_download_response

- name: Validate public edge security headers on APK download
  ansible.builtin.assert:
    that:
      - chronicle_apk_download_response.x_content_type_options | default('') == 'nosniff'
      - chronicle_apk_download_response.x_frame_options | default('') == 'DENY'
      - chronicle_apk_download_response.referrer_policy | default('') == 'no-referrer'
      - "'max-age=31536000' in (chronicle_apk_download_response.strict_transport_security | default(''))"
      - "'camera=()' in (chronicle_apk_download_response.permissions_policy | default(''))"
    fail_msg: "APK public edge security headers are missing or incomplete: {{ chronicle_apk_download_response }}"

- name: Validate unapproved APK download path is blocked
  ansible.builtin.uri:
    url: "https://{{ chronicle_hostname }}/chronicle/downloads/not-approved.apk"
    validate_certs: false
    status_code: 404
    return_content: false

- name: Validate preprocessing GUI trailing-slash path
  ansible.builtin.uri:
    url: "https://{{ chronicle_hostname }}/chronicle/preprocessing-gui/"
    validate_certs: false
    status_code: 200
    return_content: false

- name: Validate preprocessing GUI bare path redirects
  ansible.builtin.uri:
    url: "https://{{ chronicle_hostname }}/chronicle/preprocessing-gui"
    validate_certs: false
    status_code: 302
    follow_redirects: none
    return_content: false

- name: Check CrowdSec deployment when enforcement is required
  ansible.builtin.command: >-
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }}
    -n {{ chronicle_security_namespace }} rollout status deploy/chronicle-crowdsec --timeout=3m
  changed_when: false
  when: chronicle_require_crowdsec_enforced | bool

- name: Check RKE2 Traefik arguments for CrowdSec plugin when enforcement is required
  ansible.builtin.shell: >-
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }}
    -n kube-system get ds rke2-traefik
    -o jsonpath='{.spec.template.spec.containers[0].args}'
  args:
    executable: /bin/bash
  register: chronicle_traefik_args
  changed_when: false
  when: chronicle_require_crowdsec_enforced | bool

- name: Require Traefik to fail closed on CrowdSec plugin failure
  ansible.builtin.assert:
    that:
      - "'crowdsec-bouncer' in chronicle_traefik_args.stdout"
      - "'abortOnPluginFailure=true' in chronicle_traefik_args.stdout"
    fail_msg: "Traefik is not configured for fail-closed CrowdSec bouncer enforcement."
  when: chronicle_require_crowdsec_enforced | bool

- name: Validate public Traefik routes put CrowdSec bouncer first when enforcement is required
  ansible.builtin.shell: |
    set -o pipefail
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }} -n {{ chronicle_namespace }} get ingressroute.traefik.io -o json |
      python3 -c '
    import json
    import sys

    data = json.load(sys.stdin)
    expected = "{{ chronicle_expected_waf_middleware }}"
    failures = []
    for ingressroute in data.get("items", []):
        name = ingressroute.get("metadata", {}).get("name", "<unknown>")
        for index, route in enumerate(ingressroute.get("spec", {}).get("routes", [])):
            middlewares = route.get("middlewares", [])
            if not middlewares:
                failures.append(f"{name} route {index}: no middlewares")
                continue
            first_name = middlewares[0].get("name")
            if first_name != expected:
                failures.append(f"{name} route {index}: first middleware is {first_name!r}, expected {expected!r}")

    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    '
  args:
    executable: /bin/bash
  changed_when: false
  when: chronicle_require_crowdsec_enforced | bool

- name: Validate benign request still passes through WAF when enforcement is required
  ansible.builtin.uri:
    url: "https://{{ chronicle_hostname }}{{ chronicle_waf_benign_path }}"
    validate_certs: false
    status_code: 200
    return_content: false
  when: chronicle_require_crowdsec_enforced | bool

- name: Validate WAF blocks common malicious probes when enforcement is required
  ansible.builtin.uri:
    url: "https://{{ chronicle_hostname }}{{ item }}"
    validate_certs: false
    status_code: 403
    return_content: false
  loop: "{{ chronicle_waf_block_probe_paths }}"
  when: chronicle_require_crowdsec_enforced | bool

- name: Record the approved WAF exception when enforcement is not required
  ansible.builtin.debug:
    msg: "CrowdSec enforcement is not required for this inventory; headers/rate limits are active, but WAF is a documented exception."
  when: not (chronicle_require_crowdsec_enforced | bool)
