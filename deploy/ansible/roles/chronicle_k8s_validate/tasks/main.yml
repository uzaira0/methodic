- name: Validate public Traefik routes are bound to the expected hostname
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    import re
    import subprocess
    import sys

    kubectl = "{{ chronicle_kubectl }}"
    kubeconfig = "{{ chronicle_kubeconfig }}"
    namespace = "{{ chronicle_namespace }}"
    contracts = {{ chronicle_expected_public_ingressroutes | to_json }}
