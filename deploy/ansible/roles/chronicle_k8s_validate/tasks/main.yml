---
- name: Check Kubernetes node readiness
  ansible.builtin.command: >-
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }}
    wait node --all --for=condition=Ready --timeout=2m
  changed_when: false

- name: Validate Cilium operator rollout
  ansible.builtin.command: >-
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }}
    -n kube-system rollout status deploy/cilium-operator --timeout=2m
  changed_when: false
  when: chronicle_manage_single_node_cilium_operator | bool

- name: Validate no active pods are stuck outside Running
  ansible.builtin.shell: |
    set -euo pipefail
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }} get pods -A \
      --field-selector=status.phase!=Running,status.phase!=Succeeded \
      -o json | python3 -c '
    import json
    import sys

    payload = json.load(sys.stdin)
    offenders = []
    for item in payload.get("items", []):
        metadata = item.get("metadata", {})
        status = item.get("status", {})
        namespace = metadata.get("namespace", "")
        name = metadata.get("name", "")
        phase = status.get("phase", "")
        reason = status.get("reason", "")
        offenders.append(f"{namespace}/{name}: {phase} {reason}".strip())

    if offenders:
        print("\n".join(offenders), file=sys.stderr)
        sys.exit(1)
    print("no active pods stuck outside Running/Succeeded")
    '
  args:
    executable: /bin/bash
  changed_when: false

- name: Validate Chronicle deployment rollouts
  ansible.builtin.command: >-
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }}
    -n {{ chronicle_namespace }} rollout status deploy/{{ item }} --timeout=3m
  loop: "{{ chronicle_expected_deployments }}"
  changed_when: false

- name: Validate constrained deployments use zero-surge rollouts
  ansible.builtin.shell: |
    set -euo pipefail
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }} \
      -n {{ chronicle_namespace }} get deploy/{{ item }} -o json | python3 -c '
    import json
    import sys

    deployment = json.load(sys.stdin)
    name = deployment.get("metadata", {}).get("name", "{{ item }}")
    strategy = deployment.get("spec", {}).get("strategy", {})
    rolling = strategy.get("rollingUpdate", {})
    failures = []
    if strategy.get("type") != "RollingUpdate":
        failures.append(f"{name}: strategy.type must be RollingUpdate")
    if str(rolling.get("maxSurge")) != "0":
        failures.append(f"{name}: rollingUpdate.maxSurge must be 0")
    if str(rolling.get("maxUnavailable")) != "1":
        failures.append(f"{name}: rollingUpdate.maxUnavailable must be 1")
    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    print(f"{name}: zero-surge rollout strategy validated")
    '
  args:
    executable: /bin/bash
  loop: "{{ chronicle_zero_surge_deployments }}"
  changed_when: false

- name: Validate process-local-cache deployments use Recreate and one replica
  ansible.builtin.shell: |
    set -euo pipefail
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }} \
      -n {{ chronicle_namespace }} get deploy/{{ item }} -o json | python3 -c '
    import json
    import sys

    deployment = json.load(sys.stdin)
    name = deployment.get("metadata", {}).get("name", "{{ item }}")
    spec = deployment.get("spec", {})
    failures = []
    if int(spec.get("replicas", 0)) != 1:
        failures.append(f"{name}: replicas must be exactly 1")
    strategy = spec.get("strategy", {})
    if strategy.get("type") != "Recreate":
        failures.append(f"{name}: strategy.type must be Recreate")
    if "rollingUpdate" in strategy:
        failures.append(f"{name}: Recreate strategy must not include rollingUpdate settings")
    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    print(f"{name}: single-replica Recreate topology validated")
    '
  args:
    executable: /bin/bash
  loop: "{{ chronicle_recreate_deployments }}"
  changed_when: false

- name: Validate Chronicle statefulset rollouts
  ansible.builtin.command: >-
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }}
    -n {{ chronicle_namespace }} rollout status statefulset/{{ item }} --timeout=3m
  loop: "{{ chronicle_expected_statefulsets }}"
  changed_when: false

- name: Validate Chronicle ExternalSecrets are synced
  ansible.builtin.command: >-
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }}
    -n {{ chronicle_namespace }} wait externalsecret/{{ item }}
    --for=condition=Ready=True --timeout=2m
  loop: "{{ chronicle_expected_external_secrets }}"
  changed_when: false

- name: Validate observability deployment rollouts
  ansible.builtin.command: >-
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }}
    -n {{ chronicle_observability_namespace }} rollout status deploy/{{ item }} --timeout=3m
  loop: "{{ chronicle_expected_observability_deployments }}"
  changed_when: false

- name: Validate Grafana ExternalSecret is synced
  ansible.builtin.command: >-
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }}
    -n {{ chronicle_observability_namespace }} wait externalsecret/grafana-admin
    --for=condition=Ready=True --timeout=2m
  changed_when: false

- name: Validate synced Kubernetes Secret keys are populated
  ansible.builtin.shell: |
    python3 - <<'PY'
    import base64
    import json
    import re
    import subprocess
    import sys

    kubectl = "{{ chronicle_kubectl }}"
    kubeconfig = "{{ chronicle_kubeconfig }}"
    contracts = {{ (chronicle_required_secret_contracts + (chronicle_crowdsec_secret_contracts if chronicle_require_crowdsec_enforced | bool else [])) | to_json }}
    equalities = {{ chronicle_secret_equalities | to_json }}
    placeholder_pattern = re.compile({{ chronicle_secret_placeholder_pattern | to_json }})
    failures = []
    decoded = {}

    def get_secret(namespace, name):
        try:
            raw = subprocess.check_output(
                [kubectl, "--kubeconfig", kubeconfig, "-n", namespace, "get", "secret", name, "-o", "json"],
                text=True,
                stderr=subprocess.DEVNULL,
            )
        except subprocess.CalledProcessError:
            failures.append(f"{namespace}/{name}: secret missing")
            return {}
        return json.loads(raw).get("data", {})

    def decode_key(namespace, name, key, encoded):
        ref = f"{namespace}/{name}/{key}"
        if key not in encoded:
            failures.append(f"{ref}: key missing")
            return b""
        try:
            value = base64.b64decode(encoded[key], validate=True)
        except Exception:
            failures.append(f"{ref}: value is not valid base64")
            return b""
        decoded[(namespace, name, key)] = value
        return value

    for contract in contracts:
        namespace = contract["namespace"]
        name = contract["name"]
        data = get_secret(namespace, name)
        for key, rules in contract.get("keys", {}).items():
            value = decode_key(namespace, name, key, data)
            ref = f"{namespace}/{name}/{key}"
            min_bytes = int(rules.get("min_bytes", 1))
            if len(value) < min_bytes:
                failures.append(f"{ref}: decoded value shorter than {min_bytes} bytes")
            try:
                text = value.decode("utf-8")
            except UnicodeDecodeError:
                text = ""
            if text and placeholder_pattern.search(text):
                failures.append(f"{ref}: value matches placeholder pattern")
            required_fragment = rules.get("contains")
            if required_fragment and required_fragment not in text:
                failures.append(f"{ref}: expected PEM/content marker missing")

    for equality in equalities:
        left = equality["left"]
        right = equality["right"]
        left_ref = (left["namespace"], left["name"], left["key"])
        right_ref = (right["namespace"], right["name"], right["key"])
        if decoded.get(left_ref, object()) != decoded.get(right_ref, object()):
            failures.append(
                f"{left['namespace']}/{left['name']}/{left['key']} does not match "
                f"{right['namespace']}/{right['name']}/{right['key']}"
            )

    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    print(f"validated {sum(len(contract.get('keys', {})) for contract in contracts)} secret keys without printing values")
    PY
  args:
    executable: /bin/bash
  changed_when: false

- name: Validate Kubernetes TLS secrets expire safely and keypairs match
  ansible.builtin.shell: |
    python3 - <<'PY'
    import base64
    import json
    import os
    import shutil
    import subprocess
    import sys
    import tempfile

    kubectl = "{{ chronicle_kubectl }}"
    kubeconfig = "{{ chronicle_kubeconfig }}"
    contracts = {{ chronicle_tls_secret_contracts | to_json }}
    failures = []
    summaries = []

    def get_secret(namespace, name):
        try:
            raw = subprocess.check_output(
                [kubectl, "--kubeconfig", kubeconfig, "-n", namespace, "get", "secret", name, "-o", "json"],
                text=True,
                stderr=subprocess.DEVNULL,
            )
        except subprocess.CalledProcessError:
            failures.append(f"{namespace}/{name}: secret missing")
            return {}
        return json.loads(raw).get("data", {})

    def write_secret_key(tempdir, namespace, name, key, encoded):
        ref = f"{namespace}/{name}/{key}"
        if key not in encoded:
            failures.append(f"{ref}: key missing")
            return ""
        try:
            value = base64.b64decode(encoded[key], validate=True)
        except Exception:
            failures.append(f"{ref}: value is not valid base64")
            return ""
        path = os.path.join(tempdir, key.replace("/", "_"))
        fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
        with os.fdopen(fd, "wb") as handle:
            handle.write(value)
        return path

    def openssl(args):
        return subprocess.run(
            ["openssl", *args],
            stdout=subprocess.PIPE,
            stderr=subprocess.PIPE,
            text=False,
        )

    tempdir = tempfile.mkdtemp(prefix="chronicle-tls-")
    os.chmod(tempdir, 0o700)
    try:
        for contract in contracts:
            namespace = contract["namespace"]
            name = contract["name"]
            ca_key = contract["ca_cert_key"]
            server_cert_key = contract["server_cert_key"]
            server_key_key = contract["server_key_key"]
            min_days = int(contract.get("min_days", 14))
            checkend_seconds = min_days * 24 * 60 * 60
            data = get_secret(namespace, name)
            secret_dir = os.path.join(tempdir, f"{namespace}_{name}")
            os.mkdir(secret_dir, 0o700)

            ca_path = write_secret_key(secret_dir, namespace, name, ca_key, data)
            server_cert_path = write_secret_key(secret_dir, namespace, name, server_cert_key, data)
            server_key_path = write_secret_key(secret_dir, namespace, name, server_key_key, data)
            if not (ca_path and server_cert_path and server_key_path):
                continue

            for key, path in ((ca_key, ca_path), (server_cert_key, server_cert_path)):
                cert_ref = f"{namespace}/{name}/{key}"
                expiry = openssl(["x509", "-in", path, "-checkend", str(checkend_seconds), "-noout"])
                if expiry.returncode != 0:
                    failures.append(f"{cert_ref}: certificate expires within {min_days} days or is invalid")
                enddate = openssl(["x509", "-in", path, "-noout", "-enddate"])
                if enddate.returncode != 0:
                    failures.append(f"{cert_ref}: certificate end date is unreadable")

            verify = openssl(["verify", "-CAfile", ca_path, server_cert_path])
            if verify.returncode != 0:
                failures.append(f"{namespace}/{name}: server certificate does not verify against configured CA")

            cert_pubkey = openssl(["x509", "-in", server_cert_path, "-pubkey", "-noout"])
            key_pubkey = openssl(["pkey", "-in", server_key_path, "-pubout"])
            if cert_pubkey.returncode != 0 or key_pubkey.returncode != 0:
                failures.append(f"{namespace}/{name}: server certificate or private key public material is unreadable")
            elif cert_pubkey.stdout != key_pubkey.stdout:
                failures.append(f"{namespace}/{name}: server certificate does not match server private key")

            summaries.append(f"{namespace}/{name}: tls chain/keypair/min_days={min_days}")
    finally:
        shutil.rmtree(tempdir)

    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    print("validated Kubernetes TLS secrets without printing certificate or key material: " + "; ".join(summaries))
    PY
  args:
    executable: /bin/bash
  changed_when: false

- name: Validate restricted Pod Security namespace labels
  ansible.builtin.shell: >-
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }}
    get namespace {{ item }}
    -o jsonpath='{.metadata.labels.pod-security\.kubernetes\.io/enforce}'
  args:
    executable: /bin/bash
  loop: "{{ chronicle_restricted_namespaces }}"
  register: chronicle_restricted_namespace_labels
  changed_when: false

- name: Require Chronicle namespaces to enforce restricted Pod Security
  ansible.builtin.assert:
    that:
      - chronicle_restricted_namespace_labels.results | length == chronicle_restricted_namespaces | length
      - chronicle_restricted_namespace_labels.results | map(attribute='stdout') | select('equalto', 'restricted') | list | length == chronicle_restricted_namespaces | length
    fail_msg: "A Chronicle namespace is not enforcing restricted Pod Security: {{ chronicle_restricted_namespace_labels.results | map(attribute='stdout') | list }}"

- name: Validate default-deny NetworkPolicies
  ansible.builtin.shell: |
    set -euo pipefail
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }} -n {{ item }} get networkpolicy default-deny -o json |
      python3 -c '
    import json
    import sys

    policy = json.load(sys.stdin)
    namespace = policy.get("metadata", {}).get("namespace", "{{ item }}")
    name = policy.get("metadata", {}).get("name", "default-deny")
    spec = policy.get("spec", {})
    failures = []

    if spec.get("podSelector") != {}:
        failures.append(f"{namespace}/{name}: podSelector must be empty to select all pods")

    policy_types = set(spec.get("policyTypes", []))
    expected_types = {"Ingress", "Egress"}
    if policy_types != expected_types:
        failures.append(f"{namespace}/{name}: policyTypes must be exactly {sorted(expected_types)}, got {sorted(policy_types)}")

    if spec.get("ingress") not in (None, []):
        failures.append(f"{namespace}/{name}: default-deny must not include ingress allow rules")
    if spec.get("egress") not in (None, []):
        failures.append(f"{namespace}/{name}: default-deny must not include egress allow rules")

    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    print(f"{namespace}/{name}: default-deny selects all pods and denies ingress/egress")
    '
  args:
    executable: /bin/bash
  loop: "{{ chronicle_default_deny_namespaces }}"
  changed_when: false

- name: Validate Chronicle NetworkPolicies match the expected allowlist
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    import subprocess
    import sys

    kubectl = "{{ chronicle_kubectl }}"
    kubeconfig = "{{ chronicle_kubeconfig }}"
    expected = {
        contract["namespace"]: sorted(contract.get("names", []))
        for contract in {{ chronicle_expected_networkpolicies | to_json }}
    }
    failures = []

    for namespace, expected_names in expected.items():
        raw = subprocess.check_output(
            [kubectl, "--kubeconfig", kubeconfig, "-n", namespace, "get", "networkpolicy", "-o", "json"],
            text=True,
        )
        payload = json.loads(raw)
        actual_names = sorted(
            item.get("metadata", {}).get("name", "")
            for item in payload.get("items", [])
            if item.get("metadata", {}).get("name")
        )
        extra = sorted(set(actual_names) - set(expected_names))
        missing = sorted(set(expected_names) - set(actual_names))
        if extra:
            failures.append(f"{namespace}: unexpected NetworkPolicies {extra}")
        if missing:
            failures.append(f"{namespace}: expected NetworkPolicies missing {missing}")

    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    total = sum(len(names) for names in expected.values())
    print(f"validated {total} NetworkPolicies against namespace allowlists")
    PY
  args:
    executable: /bin/bash
  changed_when: false

- name: Validate Kubernetes services are not directly exposed
  ansible.builtin.shell: |
    set -euo pipefail
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }} get services -A -o json |
      python3 -c '
    import json
    import sys

    payload = json.load(sys.stdin)
    disallowed = set({{ chronicle_disallowed_service_types | to_json }})
    failures = []
    for service in payload.get("items", []):
        metadata = service.get("metadata", {})
        spec = service.get("spec", {})
        service_type = spec.get("type", "ClusterIP")
        if service_type in disallowed:
            namespace = metadata.get("namespace", "<unknown>")
            name = metadata.get("name", "<unknown>")
            failures.append(f"{namespace}/{name}: service type {service_type} is not allowed")

    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    print("no disallowed Kubernetes service exposure found")
    '
  args:
    executable: /bin/bash
  changed_when: false

- name: Validate Kubernetes Services do not use external address fields
  ansible.builtin.shell: |
    set -euo pipefail
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }} get services -A -o json |
      python3 -c '
    import json
    import sys

    payload = json.load(sys.stdin)
    failures = []
    for service in payload.get("items", []):
        metadata = service.get("metadata", {})
        spec = service.get("spec", {})
        namespace = metadata.get("namespace", "<unknown>")
        name = metadata.get("name", "<unknown>")
        ref = f"{namespace}/{name}"

        if spec.get("externalIPs"):
            failures.append(f"{ref}: externalIPs are not allowed")
        if spec.get("loadBalancerIP"):
            failures.append(f"{ref}: loadBalancerIP is not allowed")
        if spec.get("externalName"):
            failures.append(f"{ref}: externalName is not allowed")

    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    print("no Kubernetes Service external address fields found")
    '
  args:
    executable: /bin/bash
  changed_when: false

- name: Validate managed workload templates do not use host networking
  ansible.builtin.shell: |
    set -euo pipefail
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }} -n {{ item }} get deploy,statefulset,cronjob -o json |
      python3 -c '
    import json
    import sys

    payload = json.load(sys.stdin)
    failures = []
    for workload in payload.get("items", []):
        kind = workload.get("kind")
        name = workload.get("metadata", {}).get("name", "<unknown>")
        spec = workload.get("spec", {})
        if kind == "CronJob":
            template = spec.get("jobTemplate", {}).get("spec", {}).get("template", {}).get("spec", {})
        else:
            template = spec.get("template", {}).get("spec", {})

        ref = f"{{ item }}/{kind}/{name}"
        if template.get("hostNetwork") is True:
            failures.append(ref + ": hostNetwork must not be true")
        containers = template.get("initContainers", []) + template.get("containers", [])
        for container in containers:
            container_name = container.get("name", "<container>")
            for port in container.get("ports", []) or []:
                if "hostPort" in port:
                    host_port = port.get("hostPort")
                    failures.append(f"{ref}/{container_name}: hostPort {host_port} must not be set")

    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    print("{{ item }}: no hostNetwork or hostPort usage in managed workload templates")
    '
  args:
    executable: /bin/bash
  loop: "{{ chronicle_workload_template_namespaces }}"
  changed_when: false

- name: Validate managed workload templates do not override DNS resolution
  ansible.builtin.shell: |
    set -euo pipefail
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }} -n {{ item }} get deploy,statefulset,cronjob -o json |
      python3 -c '
    import json
    import sys

    payload = json.load(sys.stdin)
    failures = []
    for workload in payload.get("items", []):
        kind = workload.get("kind")
        name = workload.get("metadata", {}).get("name", "<unknown>")
        spec = workload.get("spec", {})
        if kind == "CronJob":
            template = spec.get("jobTemplate", {}).get("spec", {}).get("template", {}).get("spec", {})
        else:
            template = spec.get("template", {}).get("spec", {})

        ref = f"{{ item }}/{kind}/{name}"
        dns_policy = template.get("dnsPolicy", "ClusterFirst")
        if dns_policy != "ClusterFirst":
            failures.append(f"{ref}: dnsPolicy must be ClusterFirst, got {dns_policy!r}")
        if template.get("dnsConfig"):
            failures.append(ref + ": dnsConfig overrides are not allowed")
        if template.get("hostAliases"):
            failures.append(ref + ": hostAliases are not allowed")

    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    print("{{ item }}: managed workload DNS settings use cluster defaults")
    '
  args:
    executable: /bin/bash
  loop: "{{ chronicle_workload_template_namespaces }}"
  changed_when: false

- name: Validate namespace ResourceQuota and LimitRange controls
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    import re
    import subprocess
    import sys

    kubectl = "{{ chronicle_kubectl }}"
    kubeconfig = "{{ chronicle_kubeconfig }}"
    contracts = {{ chronicle_namespace_control_contracts | to_json }}
    failures = []

    def kjson(namespace, kind, name):
        try:
            raw = subprocess.check_output(
                [kubectl, "--kubeconfig", kubeconfig, "-n", namespace, "get", kind, name, "-o", "json"],
                text=True,
                stderr=subprocess.DEVNULL,
            )
        except subprocess.CalledProcessError:
            failures.append(f"{namespace}/{kind}/{name}: resource missing")
            return {}
        return json.loads(raw)

    def cpu_millis(value):
        text = str(value)
        if text.endswith("m"):
            return int(text[:-1])
        return int(float(text) * 1000)

    def quantity_bytes(value):
        text = str(value)
        match = re.match(r"^([0-9.]+)([KMGTE]i?|[numkMGTPE])?$", text)
        if not match:
            raise ValueError("unsupported quantity " + text)
        number = float(match.group(1))
        unit = match.group(2) or ""
        multipliers = {
            "": 1,
            "n": 1e-9,
            "u": 1e-6,
            "m": 1e-3,
            "k": 1000,
            "K": 1000,
            "M": 1000 ** 2,
            "G": 1000 ** 3,
            "T": 1000 ** 4,
            "P": 1000 ** 5,
            "E": 1000 ** 6,
            "Ki": 1024,
            "Mi": 1024 ** 2,
            "Gi": 1024 ** 3,
            "Ti": 1024 ** 4,
            "Pi": 1024 ** 5,
            "Ei": 1024 ** 6,
        }
        return int(number * multipliers[unit])

    def normalized(key, value):
        if value is None:
            return None
        text = str(value)
        if key.endswith(".cpu") or key == "cpu":
            return ("cpu", cpu_millis(text))
        if "memory" in key or "storage" in key:
            return ("bytes", quantity_bytes(text))
        return ("count", int(text))

    def compare_quantity(ref, key, actual, expected):
        if actual is None:
            failures.append(f"{ref}/{key}: value missing")
            return
        try:
            actual_normalized = normalized(key, actual)
            expected_normalized = normalized(key, expected)
        except Exception as exc:
            failures.append(f"{ref}/{key}: unsupported quantity: {exc}")
            return
        if actual_normalized != expected_normalized:
            failures.append(f"{ref}/{key}: {actual} does not match expected {expected}")

    for contract in contracts:
        namespace = contract["namespace"]
        quota_contract = contract["resource_quota"]
        quota_name = quota_contract["name"]
        quota = kjson(namespace, "resourcequota", quota_name)
        hard = quota.get("spec", {}).get("hard", {})
        for key, expected in quota_contract.get("hard", {}).items():
            compare_quantity(f"{namespace}/resourcequota/{quota_name}", key, hard.get(key), expected)

        limit_contract = contract["limit_range"]
        limit_name = limit_contract["name"]
        limit_range = kjson(namespace, "limitrange", limit_name)
        limits_by_type = {
            item.get("type"): item
            for item in limit_range.get("spec", {}).get("limits", [])
        }
        for limit_type, type_contract in (("Container", limit_contract.get("container", {})), ("Pod", limit_contract.get("pod", {}))):
            if not type_contract:
                continue
            actual_limit = limits_by_type.get(limit_type)
            if actual_limit is None:
                failures.append(f"{namespace}/limitrange/{limit_name}: missing {limit_type} limit")
                continue
            for section, expected_values in type_contract.items():
                actual_values = actual_limit.get(section, {})
                for key, expected in expected_values.items():
                    compare_quantity(f"{namespace}/limitrange/{limit_name}/{limit_type}/{section}", key, actual_values.get(key), expected)

    print(f"validated namespace controls for {len(contracts)} namespaces")
    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    PY
  args:
    executable: /bin/bash
  changed_when: false

- name: Validate workload template security invariants
  ansible.builtin.shell: |
    set -o pipefail
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }} -n {{ item }} get deploy,statefulset,cronjob -o json |
      python3 -c '
    import json
    import sys

    data = json.load(sys.stdin)
    failures = []

    for workload in data.get("items", []):
        kind = workload.get("kind")
        name = workload.get("metadata", {}).get("name", "<unknown>")
        spec = workload.get("spec", {})
        if kind == "CronJob":
            template = spec.get("jobTemplate", {}).get("spec", {}).get("template", {}).get("spec", {})
        else:
            template = spec.get("template", {}).get("spec", {})

        ref = kind + "/" + name
        if template.get("automountServiceAccountToken") is not False:
            failures.append(ref + ": automountServiceAccountToken must be false")
        if template.get("hostPID") is True:
            failures.append(ref + ": hostPID must not be true")
        if template.get("hostIPC") is True:
            failures.append(ref + ": hostIPC must not be true")

        service_account = template.get("serviceAccountName")
        if not service_account or service_account == "default":
            failures.append(ref + ": serviceAccountName must be explicit and not default")

        containers = template.get("initContainers", []) + template.get("containers", [])
        for container in containers:
            container_name = container.get("name", "<container>")
            container_ref = ref + "/" + container_name
            pod_security = template.get("securityContext", {})
            container_security = container.get("securityContext", {})

            if container.get("envFrom"):
                failures.append(container_ref + ": envFrom bulk environment imports are not allowed")

            image = container.get("image", "")
            image_tail = image.rsplit("/", 1)[-1]
            if image_tail.endswith(":latest") or ("@" not in image and ":" not in image_tail):
                failures.append(ref + ": mutable or untagged image " + image)

            image_pull_policy = container.get("imagePullPolicy")
            allowed_pull_policies = {{ chronicle_allowed_image_pull_policies | to_json }}
            if image_pull_policy not in allowed_pull_policies:
                failures.append(
                    container_ref
                    + ": imagePullPolicy must be one of "
                    + ", ".join(allowed_pull_policies)
                    + "; got "
                    + repr(image_pull_policy)
                )

            if container_security.get("privileged") is True:
                failures.append(container_ref + ": privileged must not be true")

            if container_security.get("procMount") == "Unmasked":
                failures.append(container_ref + ": procMount Unmasked is not allowed")

            if container_security.get("allowPrivilegeEscalation") is not False:
                failures.append(container_ref + ": allowPrivilegeEscalation must be false")

            if "ALL" not in container_security.get("capabilities", {}).get("drop", []):
                failures.append(container_ref + ": capabilities.drop must include ALL")

            if not (container_security.get("runAsNonRoot") is True or pod_security.get("runAsNonRoot") is True):
                failures.append(container_ref + ": runAsNonRoot must be true at pod or container level")

            seccomp_type = container_security.get("seccompProfile", {}).get("type") or pod_security.get("seccompProfile", {}).get("type")
            if seccomp_type != "RuntimeDefault":
                failures.append(container_ref + ": seccompProfile.type must be RuntimeDefault at pod or container level")

            readwrite_root_allowed = container_ref in {{ chronicle_readwrite_root_containers | to_json }}
            if container_security.get("readOnlyRootFilesystem") is not True and not readwrite_root_allowed:
                failures.append(container_ref + ": readOnlyRootFilesystem must be true")

            resources = container.get("resources", {})
            requests = resources.get("requests", {})
            limits = resources.get("limits", {})
            for key in ("cpu", "memory"):
                if not requests.get(key):
                    failures.append(container_ref + f": resources.requests.{key} is required")
                if not limits.get(key):
                    failures.append(container_ref + f": resources.limits.{key} is required")

            if kind != "CronJob" and container in template.get("containers", []):
                if not container.get("readinessProbe"):
                    failures.append(container_ref + ": readinessProbe is required")
                if not container.get("livenessProbe"):
                    failures.append(container_ref + ": livenessProbe is required")

        for volume in template.get("volumes", []):
            volume_name = volume.get("name", "<volume>")
            empty_dir = volume.get("emptyDir")
            if empty_dir is not None and not empty_dir.get("sizeLimit"):
                failures.append(ref + "/volume/" + volume_name + ": emptyDir.sizeLimit is required")

            secret = volume.get("secret")
            if secret is not None:
                default_mode = secret.get("defaultMode")
                max_secret_mode = {{ chronicle_secret_volume_max_default_mode | int }}
                if default_mode is None or default_mode > max_secret_mode:
                    failures.append(
                        ref + "/volume/" + volume_name + ": secret.defaultMode must be set and no more permissive than 0440"
                    )

            projected = volume.get("projected")
            if projected is not None:
                has_secret_source = any("secret" in source for source in projected.get("sources", []))
                default_mode = projected.get("defaultMode")
                max_secret_mode = {{ chronicle_secret_volume_max_default_mode | int }}
                if has_secret_source and (default_mode is None or default_mode > max_secret_mode):
                    failures.append(
                        ref + "/volume/" + volume_name + ": projected.defaultMode must be set and no more permissive than 0440 when projecting Secrets"
                    )

    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    '
  args:
    executable: /bin/bash
  loop: "{{ chronicle_workload_template_namespaces }}"
  changed_when: false

- name: Validate sensitive environment variables are not literal values
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    import subprocess
    import sys

    kubectl = "{{ chronicle_kubectl }}"
    kubeconfig = "{{ chronicle_kubeconfig }}"
    namespaces = {{ chronicle_workload_template_namespaces | to_json }}
    allowed_literal_envs = {
        item["ref"]: str(item.get("value", ""))
        for item in {{ chronicle_allowed_sensitive_literal_envs | to_json }}
    }
    failures = []

    def is_sensitive_env(name):
        upper = name.upper()
        if upper.endswith(("_TOKEN_URI", "_TOKEN_URL", "_TOKEN_CLAIM", "_TOKEN_EXPIRY_MINUTES", "_TOKEN_EXPIRY_DAYS")):
            return False
        fragments = (
            "PASSWORD",
            "PASSWD",
            "SECRET",
            "CREDENTIAL",
            "PASSPHRASE",
            "PRIVATE_KEY",
            "API_KEY",
            "BOUNCER_KEY",
        )
        if any(fragment in upper for fragment in fragments):
            return True
        return upper.endswith("_TOKEN") or "_TOKEN_" in upper

    def workload_template(workload):
        spec = workload.get("spec", {})
        if workload.get("kind") == "CronJob":
            return spec.get("jobTemplate", {}).get("spec", {}).get("template", {}).get("spec", {})
        return spec.get("template", {}).get("spec", {})

    for namespace in namespaces:
        raw = subprocess.check_output(
            [kubectl, "--kubeconfig", kubeconfig, "-n", namespace, "get", "deploy,statefulset,cronjob", "-o", "json"],
            text=True,
        )
        payload = json.loads(raw)
        for workload in payload.get("items", []):
            kind = workload.get("kind")
            name = workload.get("metadata", {}).get("name", "<unknown>")
            template = workload_template(workload)
            containers = template.get("initContainers", []) + template.get("containers", [])
            for container in containers:
                container_name = container.get("name", "<container>")
                for env in container.get("env", []) or []:
                    env_name = env.get("name", "")
                    if not is_sensitive_env(env_name):
                        continue
                    ref = f"{namespace}/{kind}/{name}/{container_name}/{env_name}"
                    if "value" in env:
                        value = str(env.get("value", ""))
                        if allowed_literal_envs.get(ref) == value:
                            continue
                        failures.append(ref + ": sensitive environment variable must not use a literal value")
                        continue
                    secret_ref = env.get("valueFrom", {}).get("secretKeyRef")
                    if not secret_ref:
                        failures.append(ref + ": sensitive environment variable must come from secretKeyRef")

    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    print("sensitive workload environment variables are secretKeyRef-backed or explicitly empty-disabled")
    PY
  args:
    executable: /bin/bash
  changed_when: false

