- name: Validate public Gateway API routes are host-scoped and pinned
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    import subprocess
    import sys

    kubectl = "{{ chronicle_kubectl }}"
    kubeconfig = "{{ chronicle_kubeconfig }}"
    namespace = "{{ chronicle_namespace }}"
    gateway_contracts = {{ chronicle_expected_public_gateways | to_json }}
    httproute_contracts = {{ chronicle_expected_public_httproutes | to_json }}
    failures = []

    def kjson(kind, name):
        try:
            raw = subprocess.check_output(
                [kubectl, "--kubeconfig", kubeconfig, "-n", namespace, "get", kind, name, "-o", "json"],
                text=True,
                stderr=subprocess.DEVNULL,
            )
        except subprocess.CalledProcessError:
            failures.append(f"{kind}/{name}: route resource missing")
            return {}
        return json.loads(raw)

    def normalize_addresses(addresses):
        return sorted(
            {
                (
                    address.get("type", ""),
                    address.get("value", ""),
                )
                for address in (addresses or [])
            }
        )

    def normalize_listeners(listeners):
        return sorted(
            {
                (
                    listener.get("name", ""),
                    listener.get("protocol", ""),
                    int(listener.get("port", 0)),
                    listener.get("hostname", ""),
                    listener.get("allowedRoutes", {}).get("namespaces", {}).get("from", ""),
                )
                for listener in (listeners or [])
            }
        )

    def normalize_parent_refs(parent_refs):
        return sorted(
            {
                (
                    parent.get("group", "gateway.networking.k8s.io"),
                    parent.get("kind", "Gateway"),
                    parent.get("name", ""),
                    parent.get("sectionName", parent.get("section_name", "")),
                )
                for parent in (parent_refs or [])
            }
        )

    for contract in gateway_contracts:
        name = contract["name"]
        gateway = kjson("gateway.gateway.networking.k8s.io", name)
        spec = gateway.get("spec", {})
        ref = f"{namespace}/Gateway/{name}"

        expected_class = contract.get("gateway_class_name")
        if spec.get("gatewayClassName") != expected_class:
            failures.append(f"{ref}: gatewayClassName {spec.get('gatewayClassName')!r} != {expected_class!r}")

        expected_addresses = normalize_addresses(contract.get("addresses", []))
        actual_addresses = normalize_addresses(spec.get("addresses", []))
        if actual_addresses != expected_addresses:
            failures.append(f"{ref}: addresses {actual_addresses!r} != {expected_addresses!r}")

        expected_listeners = normalize_listeners(
            [
                {
                    "name": listener.get("name"),
                    "protocol": listener.get("protocol"),
                    "port": listener.get("port"),
                    "hostname": listener.get("hostname"),
                    "allowedRoutes": {
                        "namespaces": {
                            "from": listener.get("allowed_routes_namespaces_from", "")
                        }
                    },
                }
                for listener in contract.get("listeners", [])
            ]
        )
        actual_listeners = normalize_listeners(spec.get("listeners", []))
        if actual_listeners != expected_listeners:
            failures.append(f"{ref}: listeners {actual_listeners!r} != {expected_listeners!r}")
        for listener in spec.get("listeners", []) or []:
            hostname = listener.get("hostname", "")
            if not hostname or "*" in hostname:
                failures.append(f"{ref}/listener/{listener.get('name', '<unknown>')}: wildcard or missing hostname is not allowed")

    for contract in httproute_contracts:
        name = contract["name"]
        httproute = kjson("httproute.gateway.networking.k8s.io", name)
        spec = httproute.get("spec", {})
        ref = f"{namespace}/HTTPRoute/{name}"

        expected_hostnames = sorted(contract.get("hostnames", []))
        actual_hostnames = sorted(spec.get("hostnames", []))
        if actual_hostnames != expected_hostnames:
            failures.append(f"{ref}: hostnames {actual_hostnames!r} != {expected_hostnames!r}")
        if not actual_hostnames or any("*" in hostname for hostname in actual_hostnames):
            failures.append(f"{ref}: wildcard or missing hostnames are not allowed")

        expected_parent_refs = normalize_parent_refs(contract.get("parent_refs", []))
        actual_parent_refs = normalize_parent_refs(spec.get("parentRefs", []))
        if actual_parent_refs != expected_parent_refs:
            failures.append(f"{ref}: parentRefs {actual_parent_refs!r} != {expected_parent_refs!r}")

    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    print(f"validated {len(gateway_contracts)} Gateway and {len(httproute_contracts)} HTTPRoute public contracts")
    PY
  args:
    executable: /bin/bash
  changed_when: false

