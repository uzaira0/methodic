- name: Validate public Traefik route priorities keep specific and blocking routes first
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    import subprocess
    import sys

    kubectl = "{{ chronicle_kubectl }}"
    kubeconfig = "{{ chronicle_kubeconfig }}"
    namespace = "{{ chronicle_namespace }}"
    ingressroutes = {{ chronicle_expected_public_ingressroutes | to_json }}
    priority_rules = {{ chronicle_expected_public_route_priority_rules | to_json }}
    catchall_match = {{ chronicle_expected_public_catchall_match | to_json }}
    failures = []
    routes = []

    def get_ingressroute(name):
        try:
            raw = subprocess.check_output(
                [kubectl, "--kubeconfig", kubeconfig, "-n", namespace, "get", "ingressroute.traefik.io", name, "-o", "json"],
                text=True,
                stderr=subprocess.DEVNULL,
            )
        except subprocess.CalledProcessError:
            failures.append(f"{namespace}/IngressRoute/{name}: public route missing")
            return {}
        return json.loads(raw)

    for route_contract in ingressroutes:
        name = route_contract["name"]
        ingress_route = get_ingressroute(name)
        ref = f"{namespace}/IngressRoute/{name}"
        for index, route in enumerate(ingress_route.get("spec", {}).get("routes", [])):
            route_ref = f"{ref}/route[{index}]"
            match = route.get("match", "")
            priority = route.get("priority")
            if not isinstance(priority, int):
                failures.append(f"{route_ref}: integer priority is required, got {priority!r}")
                continue
            routes.append({
                "ref": route_ref,
                "match": match,
                "priority": priority,
            })

    priorities = {}
    for route in routes:
        priorities.setdefault(route["priority"], []).append(route)
    for priority, matching_routes in priorities.items():
        if len(matching_routes) > 1:
            refs = ", ".join(route["ref"] for route in matching_routes)
            failures.append(f"public Traefik route priority {priority} is reused by {refs}")

    def find_route(match_contains):
        matches = [route for route in routes if match_contains in route["match"]]
        if len(matches) != 1:
            failures.append(f"expected exactly one public route match containing {match_contains!r}, found {len(matches)}")
            return None
        return matches[0]

    catchall = find_route(catchall_match)
    if catchall and routes:
        lowest_priority = min(route["priority"] for route in routes)
        if catchall["priority"] != lowest_priority:
            failures.append(
                f"{catchall['ref']}: catch-all priority {catchall['priority']} must be the lowest public route priority {lowest_priority}"
            )

    for rule in priority_rules:
        higher = find_route(rule["higher_match_contains"])
        lower = find_route(rule["lower_match_contains"])
        if not higher or not lower:
            continue
        if higher["priority"] <= lower["priority"]:
            failures.append(
                f"{higher['ref']} priority {higher['priority']} must be greater than "
                f"{lower['ref']} priority {lower['priority']} for {rule['higher_match_contains']!r}"
            )

    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    print(f"validated public Traefik priorities for {len(routes)} routes and {len(priority_rules)} precedence rules")
    PY
  args:
    executable: /bin/bash
  changed_when: false

- name: Validate public routes resolve to existing Chronicle Service ports
  ansible.builtin.shell: |
    set -o pipefail
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }} -n {{ chronicle_namespace }} get service,ingressroute.traefik.io,httproute.gateway.networking.k8s.io -o json |
      python3 -c '
    import json
    import sys

    namespace = "{{ chronicle_namespace }}"
    data = json.load(sys.stdin)
    services = {}
    failures = []
    route_refs = 0

    for item in data.get("items", []):
        if item.get("kind") != "Service":
            continue
        metadata = item.get("metadata", {})
        name = metadata.get("name")
        service_namespace = metadata.get("namespace", namespace)
        if service_namespace != namespace or not name:
            continue
        ports = set()
        for port in item.get("spec", {}).get("ports", []):
            if "port" in port:
                ports.add(str(port["port"]))
            if port.get("name"):
                ports.add(str(port["name"]))
        services[name] = ports

    def require_ref(route_kind, route_name, service_name, service_port, service_namespace=None):
        global route_refs
        route_refs += 1
        ref = f"{route_kind}/{route_name} -> {service_name}:{service_port}"
        if service_namespace and service_namespace != namespace:
            failures.append(f"{ref}: cross-namespace route target {service_namespace} is not allowed")
            return
        if service_name not in services:
            failures.append(f"{ref}: target Service does not exist")
            return
        if service_port is None:
            failures.append(f"{ref}: target Service port is missing")
            return
        if str(service_port) not in services[service_name]:
            failures.append(f"{ref}: target port is not exposed by Service/{service_name}")

    for item in data.get("items", []):
        kind = item.get("kind")
        name = item.get("metadata", {}).get("name", "<unknown>")
        if kind == "IngressRoute":
            for route in item.get("spec", {}).get("routes", []):
                for service in route.get("services", []):
                    require_ref(
                        kind,
                        name,
                        service.get("name"),
                        service.get("port"),
                        service.get("namespace"),
                    )
        elif kind == "HTTPRoute":
            for rule in item.get("spec", {}).get("rules", []):
                for backend in rule.get("backendRefs", []):
                    require_ref(
                        kind,
                        name,
                        backend.get("name"),
                        backend.get("port"),
                        backend.get("namespace"),
                    )

    print(f"validated {route_refs} public route backend references against {len(services)} Services")
    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    '
  args:
    executable: /bin/bash
  changed_when: false

