            if "HostRegexp(" in match:
                failures.append(f"{route_ref}: HostRegexp is not allowed on public routes")
            if not hosts:
                failures.append(f"{route_ref}: explicit Host(`{expected_hostname}`) match is required")
                continue
            unexpected = [host for host in hosts if host != expected_hostname]
            if unexpected:
                failures.append(f"{route_ref}: unexpected Host match values {unexpected}")
            if expected_hostname not in hosts:
                failures.append(f"{route_ref}: Host(`{expected_hostname}`) match is required")
            if any("*" in host for host in hosts):
                failures.append(f"{route_ref}: wildcard Host values are not allowed")

    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    print(f"validated public Traefik route Host matches for {len(contracts)} IngressRoute contracts")
