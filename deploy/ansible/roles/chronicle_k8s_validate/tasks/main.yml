- name: Validate selector-backed Services have ready endpoints
  ansible.builtin.shell: |
    set -o pipefail
    {{ chronicle_kubectl }} --kubeconfig {{ chronicle_kubeconfig }} -n {{ item }} get service,endpointslice.discovery.k8s.io -o json |
      python3 -c '
    import json
    import sys

    data = json.load(sys.stdin)
    services = [item for item in data.get("items", []) if item.get("kind") == "Service"]
    endpoint_slices = [item for item in data.get("items", []) if item.get("kind") == "EndpointSlice"]
    failures = []
    checked = 0

    for service in services:
        metadata = service.get("metadata", {})
        name = metadata.get("name", "<unknown>")
        namespace = metadata.get("namespace", "{{ item }}")
        if not service.get("spec", {}).get("selector"):
            continue
        checked += 1
        ready_addresses = 0
        for endpoint_slice in endpoint_slices:
            labels = endpoint_slice.get("metadata", {}).get("labels", {})
            if labels.get("kubernetes.io/service-name") != name:
                continue
            for endpoint in endpoint_slice.get("endpoints", []):
                if endpoint.get("conditions", {}).get("ready", True) is True:
                    ready_addresses += len(endpoint.get("addresses", []))
        if ready_addresses < 1:
            failures.append(f"{namespace}/{name}: selector-backed Service has no ready EndpointSlice addresses")

    print(f"{{ item }}: checked {checked} selector-backed Services")
    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    '
  args:
    executable: /bin/bash
  loop: "{{ chronicle_internal_service_namespaces }}"
  changed_when: false

