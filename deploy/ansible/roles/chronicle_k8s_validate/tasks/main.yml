- name: Validate Chronicle RBAC bindings match the expected allowlist
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    import subprocess
    import sys

    kubectl = "{{ chronicle_kubectl }}"
    kubeconfig = "{{ chronicle_kubeconfig }}"
    namespaces = {{ chronicle_rbac_binding_namespaces | to_json }}
    expected_rolebindings = {{ chronicle_expected_rolebindings | to_json }}
    failures = []

    def normalize_subjects(subjects):
        return sorted(
            {
                (
                    subject.get("kind", ""),
                    subject.get("namespace", ""),
                    subject.get("name", ""),
                )
                for subject in (subjects or [])
            }
        )

    expected = {
        (binding["namespace"], binding["name"]): {
            "role_kind": binding["role_kind"],
            "role_name": binding["role_name"],
            "subjects": normalize_subjects(binding.get("subjects", [])),
        }
        for binding in expected_rolebindings
    }
    actual = {}

    for namespace in namespaces:
        raw = subprocess.check_output(
            [kubectl, "--kubeconfig", kubeconfig, "-n", namespace, "get", "rolebindings", "-o", "json"],
            text=True,
        )
        payload = json.loads(raw)
        for binding in payload.get("items", []):
            name = binding.get("metadata", {}).get("name", "<unknown>")
            role_ref = binding.get("roleRef", {})
            actual[(namespace, name)] = {
                "role_kind": role_ref.get("kind", ""),
                "role_name": role_ref.get("name", ""),
                "subjects": normalize_subjects(binding.get("subjects", [])),
            }

    for key in sorted(set(actual) - set(expected)):
        failures.append(f"{key[0]}/RoleBinding/{key[1]}: unexpected RoleBinding")
    for key in sorted(set(expected) - set(actual)):
        failures.append(f"{key[0]}/RoleBinding/{key[1]}: expected RoleBinding missing")
    for key in sorted(set(expected) & set(actual)):
        ref = f"{key[0]}/RoleBinding/{key[1]}"
        for field in ("role_kind", "role_name", "subjects"):
            if actual[key][field] != expected[key][field]:
                failures.append(f"{ref}: {field} is {actual[key][field]!r}, expected {expected[key][field]!r}")

    raw = subprocess.check_output(
        [kubectl, "--kubeconfig", kubeconfig, "get", "clusterrolebindings", "-o", "json"],
        text=True,
    )
    payload = json.loads(raw)
    namespace_set = set(namespaces)
    for binding in payload.get("items", []):
        name = binding.get("metadata", {}).get("name", "<unknown>")
        for subject in binding.get("subjects", []) or []:
            if subject.get("kind") == "ServiceAccount" and subject.get("namespace") in namespace_set:
                failures.append(
                    f"ClusterRoleBinding/{name}: Chronicle ServiceAccount subject "
                    f"{subject.get('namespace')}/{subject.get('name')} is not allowed"
                )

    if failures:
        print("\n".join(failures), file=sys.stderr)
        sys.exit(1)
    print(f"validated {len(actual)} RoleBindings and no Chronicle ServiceAccount ClusterRoleBindings")
    PY
  args:
    executable: /bin/bash
  changed_when: false

