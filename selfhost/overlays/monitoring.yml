# Optional, private observability for a single-host Chronicle deployment.
# The stack is deliberately independent of config-guard/backend health: when Chronicle is
# broken, Grafana and retained evidence must remain available to explain why.

# Anchors do not cross YAML documents, so the base file's x-logging cap is restated here.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILES:-5}"

x-fluent-logging: &fluent-logging
  driver: fluentd
  options:
    fluentd-address: "127.0.0.1:${FLUENT_BIT_FORWARD_PORT:-24224}"
    fluentd-async: "true"
    fluentd-buffer-limit: "1048576"
    fluentd-sub-second-precision: "true"

services:
  monitoring-config:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to the digest-pinned release image}
    restart: "no"
    logging: *default-logging
    user: "0:0"
    entrypoint: ["/bin/bash", "/monitoring/render-config.sh"]
    environment:
      METRICS_USERNAME: ${METRICS_USERNAME:-chronicle-metrics}
      METRICS_PASSWORD: ${METRICS_PASSWORD:?set METRICS_PASSWORD in .env}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-chronicle-selfhost}
      RELEASE_VERSION: ${RELEASE_VERSION:-development}
    volumes:
      - ./monitoring/render-config.sh:/monitoring/render-config.sh:ro
      - monitoring_secrets:/monitoring-secrets
      - monitoring_config:/monitoring-config
      - monitoring_textfiles:/metrics
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    mem_limit: 128m
    pids_limit: 64

  # Read-only Docker API for cadvisor. A :ro bind of /var/run does not stop connect() on the
  # socket, so cadvisor with that mount held the full, writable Docker API (host root). Only
  # this service touches the socket; it answers GET container/info/version and refuses every
  # POST, and it sits on an internal network that only cadvisor joins.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    restart: unless-stopped
    logging: *default-logging
    environment:
      CONTAINERS: "1"
      INFO: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # Not read_only: the entrypoint renders haproxy.cfg into the image at start.
    mem_limit: 64m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2375/version"]
      interval: 30s
      timeout: 5s
      retries: 3

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--housekeeping_interval=15s"
      - "--docker_only=true"
      - "--store_container_labels=false"
      - "--docker=tcp://docker-socket-proxy:2375"
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [default, docker-api]
    depends_on:
      docker-socket-proxy: {condition: service_healthy}
    expose: ["8080"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    mem_limit: ${CADVISOR_MEM_LIMIT:-256m}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  operational-probe:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to the digest-pinned release image}
    restart: unless-stopped
    logging: *default-logging
    user: "0:0"
    entrypoint: ["/bin/bash", "/monitoring/probe.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-chronicle}
      POSTGRES_USER: ${POSTGRES_USER:-chronicle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      RELEASE_VERSION: ${RELEASE_VERSION:-development}
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      PUBLIC_HEALTH_URL: ${MONITORING_PUBLIC_HEALTH_URL:-}
      # :8081 is the port-only internal listener in every Caddyfile variant (self-signed cert);
      # :80 matches by host in own-tls/local-https and answers an empty 200 for any name.
      INTERNAL_HEALTH_URL: https://web:8081/health
      PROBE_INTERVAL_SECONDS: ${MONITORING_PROBE_INTERVAL_SECONDS:-30}
      COMPOSE_FILE_SELECTION: ${COMPOSE_FILE:-}
      ENABLE_ENCRYPTION: ${ENABLE_ENCRYPTION:-true}
      METRICS_DISK_BUDGET_BYTES: ${METRICS_MAX_DISK_BYTES:-5368709120}
      LOGS_DISK_BUDGET_BYTES: ${LOGS_MAX_DISK_BYTES:-5368709120}
    volumes:
      - ./monitoring/probe.sh:/monitoring/probe.sh:ro
      - ./monitoring/record-operation.sh:/monitoring/record-operation.sh:ro
      - monitoring_textfiles:/metrics
      - vm_data:/observability-data/metrics:ro
      - vl_data:/observability-data/logs:ro
      - "${CHRONICLE_STATE_DIR:-.}/backups:/backups:ro"
      - export_data:/exports:ro
      - "${CHRONICLE_STATE_DIR:-.}/tls:/tls:ro"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # Read-only traversal is needed for the mode-0700 backup and export stores. Only the
    # explicitly mounted Chronicle paths above are visible to this container.
    cap_add: ["DAC_READ_SEARCH"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    mem_limit: ${OPERATIONAL_PROBE_MEM_LIMIT:-192m}
    pids_limit: 128
    # Healthy while the probe loop keeps rewriting its textfile (interval is at most 300 s).
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /metrics/operational.prom -mmin -11 2>/dev/null)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  metrics-exporter:
    image: ${CADDY_IMAGE:?set CADDY_IMAGE to the digest-pinned release image}
    restart: unless-stopped
    logging: *default-logging
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./monitoring/metrics.Caddyfile:/etc/caddy/Caddyfile:ro
      - monitoring_textfiles:/metrics:ro
    expose: ["9090"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    read_only: true
    tmpfs: ["/config:size=8m,mode=0700", "/data:size=8m,mode=0700"]
    mem_limit: ${METRICS_EXPORTER_MEM_LIMIT:-64m}
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/operational.prom"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.149.0@sha256:13b8951e35bb3589626816538483127785a9d8b53f9f5123769db0fcab1d961f
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--storageDataPath=/vmdata"
      - "--retentionPeriod=${METRICS_RETENTION:-30d}"
      - "--storage.minFreeDiskSpaceBytes=${METRICS_MIN_FREE_DISK_BYTES:-2147483648}"
      - "--promscrape.config=/etc/vm/scrape.yml"
      - "--promscrape.maxScrapeSize=64MiB"
    volumes:
      - vm_data:/vmdata
      - monitoring_config:/etc/vm:ro
      - monitoring_secrets:/run/secrets/chronicle-metrics:ro
    expose: ["8428"]
    depends_on:
      monitoring-config: {condition: service_completed_successfully}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: ${VICTORIAMETRICS_MEM_LIMIT:-512m}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "/victoria-metrics-prod", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3

  victorialogs:
    image: victoriametrics/victoria-logs:v1.50.0@sha256:ae9bea8d8a3b0fc47c7f0058bcca410e79c84b4a0acd12d4dac71b9302526590
    restart: unless-stopped
    logging: *default-logging
    command:
      - "-storageDataPath=/vldata"
      - "-retentionPeriod=${LOGS_RETENTION:-14d}"
      - "-retention.maxDiskSpaceUsageBytes=${LOGS_MAX_DISK_BYTES:-5368709120}"
      - "-httpListenAddr=:9428"
    volumes:
      - vl_data:/vldata
    expose: ["9428"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: ${VICTORIALOGS_MEM_LIMIT:-512m}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "/victoria-logs-prod", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3

  fluent-bit:
    image: fluent/fluent-bit:5.1.1@sha256:a941bdd5ca552b2c6597fc7b3bccf2e61d30873939bab5700963de0e94ac6169
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${FLUENT_BIT_FORWARD_PORT:-24224}:24224"
    volumes:
      - ./monitoring/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./monitoring/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./monitoring/sanitize.lua:/fluent-bit/etc/sanitize.lua:ro
      - audit_logs:/var/log/chronicle:ro
      - monitoring_textfiles:/monitoring-events:ro
      - fluentbit_state:/fluent-bit/state
    depends_on:
      victorialogs: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777", "/run:size=4m,mode=0755"]
    mem_limit: ${FLUENT_BIT_MEM_LIMIT:-128m}
    pids_limit: 128
    healthcheck:
      test: ["CMD", "/fluent-bit/bin/fluent-bit", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-logs-datasource@0.31.0
      # Alert delivery target, read by grafana-alerting/contactpoints.yml. The default is the
      # closed discard port on loopback: alerts stay visible in Grafana only. See
      # docs/MONITORING-RUNBOOK.md "Attach a notification channel".
      CHRONICLE_ALERT_WEBHOOK_URL: ${CHRONICLE_ALERT_WEBHOOK_URL:-http://127.0.0.1:9/dashboard-only}
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/chronicle.yml:ro
      - ./monitoring/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/chronicle.yml:ro
      - ./monitoring/grafana-dashboards:/etc/grafana/dashboards:ro
      - ./monitoring/grafana-alerting:/etc/grafana/provisioning/alerting:ro
      - ./monitoring/runbooks.html:/usr/share/grafana/public/runbooks/index.html:ro
    depends_on:
      victoriametrics: {condition: service_healthy}
      victorialogs: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    mem_limit: ${GRAFANA_MEM_LIMIT:-512m}
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health && wget -qO- http://victoriametrics:8428/api/v1/targets | grep -q '\"health\":\"up\"' && wget -q --spider http://victorialogs:9428/health"]
      interval: 30s
      timeout: 8s
      retries: 8
      start_period: 120s

  backend:
    logging:
      <<: *fluent-logging
      options:
        fluentd-address: "127.0.0.1:${FLUENT_BIT_FORWARD_PORT:-24224}"
        fluentd-async: "true"
        fluentd-buffer-limit: "1048576"
        fluentd-sub-second-precision: "true"
        tag: chronicle.backend
  postgres:
    logging:
      <<: *fluent-logging
      options:
        fluentd-address: "127.0.0.1:${FLUENT_BIT_FORWARD_PORT:-24224}"
        fluentd-async: "true"
        fluentd-buffer-limit: "1048576"
        fluentd-sub-second-precision: "true"
        tag: chronicle.postgres
  web:
    logging:
      <<: *fluent-logging
      options:
        fluentd-address: "127.0.0.1:${FLUENT_BIT_FORWARD_PORT:-24224}"
        fluentd-async: "true"
        fluentd-buffer-limit: "1048576"
        fluentd-sub-second-precision: "true"
        tag: chronicle.web
  config-guard:
    user: "0:0"
    environment:
      MONITORING_ENABLED: "true"
      GRAFANA_BIND: ${GRAFANA_BIND:-127.0.0.1}
      GRAFANA_PORT: ${GRAFANA_PORT:-3000}
    volumes:
      - monitoring_textfiles:/monitoring-metrics

networks:
  docker-api:
    internal: true

volumes:
  vm_data:
  vl_data:
  grafana_data:
  fluentbit_state:
  monitoring_secrets:
  monitoring_config:
  monitoring_textfiles:
