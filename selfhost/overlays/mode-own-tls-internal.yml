# Deployment mode: this stack terminates TLS with YOUR certificate, and the dashboard is
# served only on a private interface. Phones still upload from the internet.
#
# The public listener needs selfhost/tls/cert.pem and selfhost/tls/key.pem. The internal
# listener gets its own certificate from cert-init -- a separate one, because it is reached
# by IP on a private address that your public certificate does not name.
services:
  config-guard:
    environment:
      TLS_MODE: own-tls
      DASHBOARD_EXPOSURE: internal

  cert-init:
    environment:
      TLS_MODE: own-tls
      DASHBOARD_EXPOSURE: internal

  web:
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${TLS_HTTP_PORT:-80}:80"
      - "${INTERNAL_BIND:-127.0.0.1}:${INTERNAL_PORT:-8081}:8081"
    volumes:
      - ./Caddyfile.split.tls:/etc/caddy/Caddyfile:ro
      - "${CHRONICLE_STATE_DIR:-.}/tls:/etc/caddy/certs:ro"
