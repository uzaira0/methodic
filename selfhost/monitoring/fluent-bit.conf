[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    storage.path  /fluent-bit/state

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224

[INPUT]
    Name              tail
    Tag               chronicle.audit
    Path              /var/log/chronicle/audit.log
    Parser            chronicle_json
    DB                /fluent-bit/state/audit.db
    Refresh_Interval  5
    Rotate_Wait       30
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

[INPUT]
    Name              tail
    Tag               chronicle.operator
    Path              /monitoring-events/operator-events.jsonl
    Parser            chronicle_json
    DB                /fluent-bit/state/operator-events.db
    Read_From_Head    On
    Refresh_Interval  5
    Rotate_Wait       30
    Mem_Buf_Limit     2MB
    Skip_Long_Lines   On

# Docker's Fluent Forward driver wraps the original stdout line in `log`. Parse known
# structured sources first, while retaining an unparsed record for the strict Lua fallback.
[FILTER]
    Name          parser
    Match         chronicle.*
    Key_Name      log
    Parser        chronicle_json
    Reserve_Data  On
    Preserve_Key  Off

[FILTER]
    Name          parser
    Match         chronicle.postgres
    Key_Name      log
    Parser        chronicle_postgres
    Reserve_Data  On
    Preserve_Key  Off

[FILTER]
    Name          lua
    Match         chronicle.*
    script        /fluent-bit/etc/sanitize.lua
    call          sanitize

[OUTPUT]
    Name              http
    Match             chronicle.*
    Host              victorialogs
    Port              9428
    URI               /insert/jsonline?_stream_fields=service,severity,stream&_msg_field=message&_time_field=timestamp
    Format            json_lines
    Json_date_format  iso8601
    Retry_Limit       False
