{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "chronicle-selfhost",
      "folder": "Chronicle",
      "interval": "60s",
      "rules": [
        {
          "uid": "backend-down",
          "title": "Chronicle backend metrics are unavailable",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "datasourceUid": "chronicle-victoriametrics",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "datasource": {
                  "type": "prometheus",
                  "uid": "chronicle-victoriametrics"
                },
                "expr": "up{job=\"chronicle-backend\"}",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "refId": "A"
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "model": {
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "expression": "A",
                "reducer": "last",
                "refId": "B",
                "type": "reduce"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "model": {
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "expression": "$B < 1",
                "refId": "C",
                "type": "math"
              }
            }
          ],
          "noDataState": "Alerting",
          "execErrState": "Alerting",
          "for": "300s",
          "annotations": {
            "summary": "Chronicle backend metrics are unavailable",
            "runbook_url": "/public/runbooks/index.html#backend-down"
          },
          "labels": {
            "service": "backend",
            "severity": "critical",
            "scope": "selfhost"
          }
        },
