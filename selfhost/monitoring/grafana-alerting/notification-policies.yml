{
  "apiVersion": 1,
  "policies": [
    {
      "orgId": 1,
      "receiver": "chronicle-dashboard-only",
      "group_by": [
        "alertname",
        "severity",
        "service"
      ],
      "group_wait": "30s",
      "group_interval": "5m",
      "repeat_interval": "24h",
      "routes": [
        {
          "receiver": "chronicle-dashboard-only",
          "object_matchers": [
            [
              "scope",
              "=",
              "selfhost"
            ]
          ],
          "group_wait": "30s",
          "group_interval": "5m",
          "repeat_interval": "24h"
        }
      ]
    }
  ]
}
