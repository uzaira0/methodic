{
  "apiVersion": 1,
  "policies": [
    {
      "orgId": 1,
      "receiver": "chronicle-dashboard-only",
      "group_by": [
        "alertname",
        "severity",
        "service"
      ],
      "group_wait": "30s",
      "group_interval": "5m",
      "repeat_interval": "24h",
      "routes": [
        {
          "receiver": "chronicle-dashboard-only",
          "object_matchers": [
            [
              "scope",
              "=",
              "selfhost"
            ]
          ],
          "mute_time_intervals": [
            "chronicle-dashboard-only-always"
          ],
          "group_wait": "30s",
          "group_interval": "5m",
          "repeat_interval": "24h"
        }
      ]
    }
  ],
  "muteTimes": [
    {
      "orgId": 1,
      "name": "chronicle-dashboard-only-always",
      "time_intervals": [
        {
          "times": [
            {
              "start_time": "00:00",
              "end_time": "24:00"
            }
          ]
        }
      ]
    }
  ]
}
