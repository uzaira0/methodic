# Deployment mode: this stack terminates TLS with YOUR certificate, and the dashboard is
# reachable wherever this stack is.
#
# Source-only experimental scaffold. This file is excluded from release bundles and must
# be paired with a separately reviewed authentication integration.
# Put the certificate and key at selfhost/tls/cert.pem and selfhost/tls/key.pem before
# starting. config-guard fails if either is missing, and cert-init chowns the key to root
# 0600 so Caddy -- which runs as root but with cap_drop: ALL, and therefore cannot override
# permissions the way root normally would -- can read it while no other local account can.
#
# There is no automatic Let's Encrypt path on purpose; see docs/CONFIGURATION.md.
services:
  config-guard:
    environment:
      TLS_MODE: own-tls
      DASHBOARD_EXPOSURE: public

  cert-init:
    environment:
      TLS_MODE: own-tls
      DASHBOARD_EXPOSURE: public

  web:
    # Bound to every interface: this listener IS the public entrypoint in this mode, so
    # there is no upstream proxy to restrict it to. Port 80 serves the redirect to 443.
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${TLS_HTTP_PORT:-80}:80"
    volumes:
      - ./experimental/public-dashboard/Caddyfile.tls:/etc/caddy/Caddyfile:ro
      - "${CHRONICLE_STATE_DIR:-.}/tls:/etc/caddy/certs:ro"
