# Deployment mode: your load balancer / reverse proxy terminates TLS, and the dashboard is
# reachable wherever this stack is.
#
# Source-only experimental scaffold. This file is excluded from release bundles and must
# be paired with a separately reviewed authentication integration.
#
# This is the least restrictive mode. Prefer mode-behind-proxy-internal.yml unless something
# outside this stack already restricts who can reach the dashboard -- config-guard warns
# about it, and refuses it outright with TESTING_LOGIN_ENABLED=true or REQUIRE_MFA=false.
services:
  config-guard:
    environment:
      TLS_MODE: behind-proxy
      DASHBOARD_EXPOSURE: public

  cert-init:
    environment:
      TLS_MODE: behind-proxy
      DASHBOARD_EXPOSURE: public

  web:
    # Plain HTTP, on the loopback by default so ONLY a proxy on this host can reach it. Set
    # HTTP_BIND in .env to the address your proxy connects to; leaving it at 127.0.0.1 with
    # an off-host load balancer gives that balancer connection refused, and nothing running
    # on this machine can detect that.
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./experimental/public-dashboard/Caddyfile:/etc/caddy/Caddyfile:ro
