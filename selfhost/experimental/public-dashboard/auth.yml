# EXPERIMENTAL ONLY: unfinished multi-user dashboard login via Keycloak.
# This file is physically outside overlays/ and is excluded from release bundles.
#
# Most self-hosters do NOT need this. For a small team, the simplest way to protect the
# dashboard is the `chronicle_dashboard_gate` snippet in ./caddy/snippets.caddy (one
# import line + one password hash in .env). Use this overlay only when you need real
# per-user accounts / SSO.
#
# It is not a supported deployment command or release configuration.
#
# This scaffold stands up Keycloak + its own database and switches the backend to the
# multi-user "production" profile wired to OIDC. Three manual steps
# remain (see docs/CONFIGURATION.md → "Multi-user login"):
#   1. Route /keycloak/ to Keycloak. Add to the `route { … }` block in
#      ./experimental/public-dashboard/Caddyfile, above
#      `import chronicle_spa`:
#          reverse_proxy /keycloak/* keycloak:8080
#      (and `docker compose restart web`).
#   2. Build and publish a separate frontend with AUTH_ENABLED=true.
#   3. Create the `chronicle` realm, the `chronicle-web` client, and at least one user
#      (kcadm) — use the source workspace's docker-compose.traefik.yml as a wiring reference.

services:
  keycloak-db:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      # Name PGDATA rather than inheriting it. postgres:18-alpine moved its default to
      # /var/lib/postgresql/18/docker and its VOLUME up to /var/lib/postgresql, so leaving
      # this unset while mounting /var/lib/postgresql/data below silently sends the cluster
      # into an anonymous volume — the marker row is gone on the next recreate. Verified on
      # 18.4-alpine. Naming the path also means the NEXT major cannot move it either.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    expose:
      - "5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
    restart: unless-stopped
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      KC_HOSTNAME: https://${DOMAIN}/keycloak
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
    expose:
      - "8080"
    depends_on:
      - keycloak-db

  # Switch the backend into multi-user mode. Override the base service's env.
  backend:
    environment:
      CHRONICLE_SERVER_ARGS: "production postgres medialocal"
      OIDC_ENABLED: "true"
      OIDC_REALM: chronicle
      OIDC_CLIENT_ID: chronicle-web
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
      OIDC_PUBLIC_BASE_URL: https://${DOMAIN}
      OIDC_ISSUER: https://${DOMAIN}/keycloak/realms/chronicle
      OIDC_AUTHORIZATION_URI: https://${DOMAIN}/keycloak/realms/chronicle/protocol/openid-connect/auth
      OIDC_TOKEN_URI: http://keycloak:8080/keycloak/realms/chronicle/protocol/openid-connect/token
      OIDC_JWKS_URI: http://keycloak:8080/keycloak/realms/chronicle/protocol/openid-connect/certs

  # Tells config-guard that a real login method is actually composed in, the same way
  # overlays/backups.yml signals BACKUPS_ENABLED. Without this the guard cannot tell
  # "SSO is configured" apart from "there is no way to sign in at all".
  config-guard:
    environment:
      AUTH_OVERLAY_ENABLED: "true"

volumes:
  keycloak_db_data:
