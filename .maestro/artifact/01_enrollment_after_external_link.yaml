# Release-artifact enrollment flow. A guarded helper must dispatch the fragment-only invitation
# over adb stdin before this flow starts, so the one-time access code never enters Maestro argv,
# environment output, screenshots, or retained diagnostics.

appId: ${APP_PACKAGE}
tags:
  - artifact
  - enrollment
---

- extendedWaitUntil:
    visible:
      id: "${APP_PACKAGE}:id/serverUrlText"
    timeout: 10000

- tapOn:
    id: "${APP_PACKAGE}:id/button"

- scrollUntilVisible:
    element:
      id: "${APP_PACKAGE}:id/acceptStudyDisclosureButton"
    direction: DOWN
    timeout: 45000
    speed: 40

- tapOn:
    id: "${APP_PACKAGE}:id/acceptStudyDisclosureButton"

- extendedWaitUntil:
    visible:
      id: "${APP_PACKAGE}:id/orientationAccept"
    timeout: 15000

- tapOn:
    id: "${APP_PACKAGE}:id/orientationAccept"

- extendedWaitUntil:
    visible:
      id: "${APP_PACKAGE}:id/doneButton"
    timeout: 45000

- tapOn:
    id: "${APP_PACKAGE}:id/doneButton"

- tapOn:
    text: "CANCEL"
    optional: true

- extendedWaitUntil:
    visible:
      id: "${APP_PACKAGE}:id/overviewStudyId"
    timeout: 15000

- assertVisible:
    id: "${APP_PACKAGE}:id/overviewStudyId"

- assertVisible:
    id: "${APP_PACKAGE}:id/overviewServerHealth"

- assertVisible:
    id: "${APP_PACKAGE}:id/overviewParticipantId"

- assertVisible:
    id: "${APP_PACKAGE}:id/overviewLastUpload"
