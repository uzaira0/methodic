id: health-connect-read-single-owner
language: Kotlin
severity: error
message: Health Connect reads belong to AndroidHealthMetricSource with current background and record grants.
files:
  - "**/chronicle/**/*.kt"
ignores:
  - "**/collection/device/AndroidHealthMetricSource.kt"
  - "**/src/test*/**"
  - "**/src/androidTest*/**"
rule:
  any:
    - pattern: $X.readRecords($$$ARGS)
