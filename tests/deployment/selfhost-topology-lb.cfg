global
    maxconn 256
    tune.bufsize 32768
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    timeout connect 5s
    timeout client "${TOPOLOGY_IDLE_TIMEOUT}"
    timeout server "${TOPOLOGY_IDLE_TIMEOUT}"
    timeout http-request 30s

frontend phones
    bind ":${TOPOLOGY_PUBLIC_PORT}" ssl crt /fixture/lb.pem
    # The TLS ingress owns these values; supplied duplicate/spoofed headers are replaced.
    http-request set-header X-Forwarded-For %[src]
    http-request del-header X-Forwarded-For if { env(TOPOLOGY_FORWARD_CLIENT) -m str false }
    http-request set-header X-Forwarded-Proto https
    http-request set-header Host "${TOPOLOGY_REWRITE_HOST}"
    acl oversized req.hdr(Content-Length) -m int gt "${TOPOLOGY_BODY_LIMIT}"
    http-request deny deny_status 413 if oversized
    default_backend pool

backend pool
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host "${TOPOLOGY_REWRITE_HOST}"
    http-check expect status 204
    server chronicle "${TOPOLOGY_POOL_ENDPOINT}" check inter 1s fall 2 rise 2

frontend researchers
    mode tcp
    bind ":${TOPOLOGY_MANAGEMENT_PORT}"
    default_backend private_dashboard

backend private_dashboard
    mode tcp
    server dashboard "${TOPOLOGY_MANAGEMENT_ENDPOINT}"

frontend pool_status
    bind :8404
    stats enable
    stats uri /stats
