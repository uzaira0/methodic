# Chronicle local log shipping to VictoriaLogs.

[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    storage.path  /fluent-bit/state

[INPUT]
    Name              tail
    Tag               chronicle.audit
    Path              /var/log/chronicle/*.log
    Parser            chronicle_audit
    DB                /fluent-bit/state/chronicle-audit.db
    Refresh_Interval  5
    Rotate_Wait       30
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

[INPUT]
    Name              tail
    Tag               traefik.access
    Path              /var/log/traefik/*.log
    DB                /fluent-bit/state/traefik-access.db
    Refresh_Interval  5
    Rotate_Wait       30
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

[FILTER]
    Name          modify
    Match         chronicle.audit
    Add           application chronicle
    Add           stream chronicle-audit
    Add           job chronicle-audit
    Add           redaction_contract chronicle-production-observability-v1
    Add           forbidden_fields_removed true
    Remove        userId
    Remove        user_id
    Remove        resourceId
    Remove        resource_id
    Remove        studyId
    Remove        study_id
    Remove        participantId
    Remove        participant_id
    Remove        sourceDevice
    Remove        source_device
    Remove        deviceId
    Remove        device_id
    Remove        ipAddress
    Remove        ip_address
    Remove        clientIp
    Remove        client_ip
    Remove        remoteAddr
    Remove        forwardedFor
    Remove        xForwardedFor
    Remove        userAgent
    Remove        user_agent
    Remove        phiFields
    Remove        errorMessage
    Remove        exceptionMessage
    Remove        stackTrace
    Remove        requestUrl
    Remove        request_url
    Remove        callbackUrl
    Remove        callback_url
    Remove        fullUrl
    Remove        full_url
    Remove        requestBody
    Remove        request_body
    Remove        responseBody
    Remove        response_body
    Remove        payload
    Remove        rawPayload
    Remove        raw_payload
    Remove        headers
    Remove        authorization
    Remove        cookie
    Remove        setCookie
    Remove        accessToken
    Remove        access_token
    Remove        refreshToken
    Remove        refresh_token
    Remove        oidcCode
    Remove        oidc_code
    Remove        jwt
    Remove        sessionId
    Remove        session_id
    Remove        apiKey
    Remove        api_key
    Remove        mobileSigningKey
    Remove        mobile_signing_key

[FILTER]
    Name          modify
    Match         traefik.access
    Add           application chronicle
    Add           stream traefik-access
    Add           job traefik-access

[OUTPUT]
    Name              http
    Match             *
    Host              victoria-logs
    Port              9428
    URI               /insert/jsonline?_stream_fields=stream,job,application&_msg_field=message,log,msg,_msg&_time_field=timestamp,time,date
    Format            json_lines
    Json_date_format  iso8601
    Retry_Limit       False
