# ============================================
# Chronicle Audit Log - Fluent Bit → Kafka
# ============================================
# Ships Chronicle audit logs to Apache Kafka.
#
# Usage with docker-compose.kafka.yml

[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# ============================================
# Input: Chronicle Audit Logs
# ============================================
[INPUT]
    Name              tail
    Tag               chronicle.audit
    Path              /var/log/chronicle/audit*.log
    Parser            json
    Refresh_Interval  5
    Rotate_Wait       30
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On

# ============================================
# Filters
# ============================================
[FILTER]
    Name          modify
    Match         chronicle.*
    Add           application chronicle
    Add           log_type audit
    Add           redaction_contract chronicle-production-observability-v1
    Add           forbidden_fields_removed true
    Remove        userId
    Remove        user_id
    Remove        resourceId
    Remove        resource_id
    Remove        studyId
    Remove        study_id
    Remove        participantId
    Remove        participant_id
    Remove        sourceDevice
    Remove        source_device
    Remove        deviceId
    Remove        device_id
    Remove        ipAddress
    Remove        ip_address
    Remove        clientIp
    Remove        client_ip
    Remove        remoteAddr
    Remove        forwardedFor
    Remove        xForwardedFor
    Remove        userAgent
    Remove        user_agent
    Remove        phiFields
    Remove        errorMessage
    Remove        exceptionMessage
    Remove        stackTrace
    Remove        requestUrl
    Remove        request_url
    Remove        callbackUrl
    Remove        callback_url
    Remove        fullUrl
    Remove        full_url
    Remove        requestBody
    Remove        request_body
    Remove        responseBody
    Remove        response_body
    Remove        payload
    Remove        rawPayload
    Remove        raw_payload
    Remove        headers
    Remove        authorization
    Remove        cookie
    Remove        setCookie
    Remove        accessToken
    Remove        access_token
    Remove        refreshToken
    Remove        refresh_token
    Remove        oidcCode
    Remove        oidc_code
    Remove        jwt
    Remove        sessionId
    Remove        session_id
    Remove        apiKey
    Remove        api_key
    Remove        mobileSigningKey
    Remove        mobile_signing_key

# ============================================
# Output: Apache Kafka
# ============================================
[OUTPUT]
    Name              kafka
    Match             chronicle.*
    Brokers           kafka:9092
    Topics            chronicle-audit
    Timestamp_Key     timestamp
    Retry_Limit       5
    # SASL authentication
    rdkafka.security.protocol       SASL_PLAINTEXT
    rdkafka.sasl.mechanism          PLAIN
    rdkafka.sasl.username           ${KAFKA_USER}
    rdkafka.sasl.password           ${KAFKA_PASSWORD}
    # Batching for performance
    rdkafka.batch.num.messages      1000
    rdkafka.queue.buffering.max.ms  100
