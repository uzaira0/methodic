# The image's init scripts run as OS user postgres while connecting as the
# configured database bootstrap role (chronicle). Peer auth would reject that
# intentional mismatch; SCRAM uses the entrypoint-provided password and remains
# safe because the Unix socket never leaves the container namespace.
local   all             all                                     scram-sha-256
# Only the backend's fixed address can cross the database bridge.
hostssl all             all             10.89.41.2/32           scram-sha-256
hostssl all             all             127.0.0.1/32            scram-sha-256
hostssl all             all             ::1/128                 scram-sha-256
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
